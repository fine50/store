<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impression</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', Arial, sans-serif; font-size: 12px; background: white; padding: 10px; direction: ltr; }
    .invoice { max-width: 1000px; margin: 0 auto; padding: 12px; }
    .top-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
    .store-info { display: flex; align-items: center; gap: 10px; width: 55%; }
    .store-logo img { width: 50px; height: 50px; object-fit: contain; }
    .store-details h2 { font-size: 14px; font-weight: 900; margin-bottom: 3px; }
    .store-details p { font-size: 10px; margin: 2px 0; }
    .client-info { width: 40%; border: 1px solid #000; padding: 6px 10px; line-height: 1.4; font-size: 11px; direction: ltr; }
    .client-info p { margin: 2px 0; text-align: left; }
    .client-info p strong { display: inline-block; min-width: 70px; }
    .info-bar { display: flex; justify-content: space-between; margin-bottom: 15px; padding: 5px 0; font-size: 11px; font-weight: 600; direction: ltr; flex-wrap: wrap; gap: 8px; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; direction: ltr; }
    th, td { border: 1px solid #000; padding: 2px 4px; font-size: 11px; }
    th { background: #f4f4f4; font-weight: 700; text-align: center; }
    .summary-line { margin: 8px 0; text-align: right; font-weight: 600; font-size: 11px; direction: ltr; }
    .footer-wrapper { break-inside: avoid; page-break-inside: avoid; margin-top: 18px; }
    .bottom-section { display: flex; justify-content: space-between; align-items: flex-end; border-top: 3px solid #000; padding-top: 14px; direction: ltr; }
    .invoice-number { text-align: right; font-size: 11px; font-weight: bold; }
    .total-box { text-align: right; min-width: 260px; }
    .total-box strong { font-size: 12px; }
    .total-amount { font-size: 16px; font-weight: 900; }
    .shipping-line { font-size: 11px; font-weight: 600; color: #000; line-height: 1.4; margin-bottom: 4px; text-align: right; }
    .shipping-line .free { color: #059669; font-weight: 700; }
    .footer-text { text-align: center; margin-top: 12px; font-size: 10px; font-weight: 500; direction: ltr; }
    .doc-title { text-align: center; margin: 10px 0; font-weight: bold; font-size: 14px; direction: ltr; }

    /* ✅ منع التفاف نصوص الأسعار في الجدول */
    table td, table th { white-space: nowrap; }
    table td:nth-child(2) { white-space: normal; }

    @media print {
      @page { size: A4; margin: 12mm 10mm 12mm 10mm; }
      body { padding: 0; background: white; }
      .invoice { padding: 0; max-width: 100%; }
      .no-print { display: none !important; }
      .shipping-line .free { color: #059669 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .footer-wrapper { margin-top: 15mm; }
    }
    td:nth-child(2) { direction: ltr; text-align: left; font-weight: 600; }
    td:nth-child(4), td:nth-child(5) { direction: ltr; text-align: right; }
    #loading { text-align: center; padding: 60px; color: #0b6e4f; font-weight: 700; font-family: 'Cairo', sans-serif; }
    #loading .spin { width: 40px; height: 40px; border: 4px solid #e9edf2; border-top-color: #0b6e4f; border-radius: 50%; animation: spin .9s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #notice { text-align: center; padding: 60px; color: #e74c3c; font-weight: 700; font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body>
  <div id="loading"><div class="spin"></div><span>Chargement...</span></div>
  <div id="notice" style="display:none"></div>
  <div id="invoiceContainer" class="invoice" style="display:none;"></div>

  <div class="no-print" style="text-align:center; margin:20px 0;" id="actionButtons">
    <button onclick="window.print()" style="padding:10px 25px; font-size:14px; margin:5px; background:#000; color:white; border:none; border-radius:5px; cursor:pointer;">Imprimer</button>
    <button onclick="window.close()" style="padding:10px 25px; font-size:14px; margin:5px; background:#e5e7eb; border:none; border-radius:5px; cursor:pointer;">Fermer</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const $ = id => document.getElementById(id);
const BOOT = window.STORE_BOOTSTRAP;
if (!BOOT || !BOOT.firebaseConfig || String(BOOT.firebaseConfig.apiKey).includes("YOUR_")) {
  $("loading").style.display = "none";
  $("notice").style.display = "block";
  $("notice").textContent = "Fichier config.js manquant";
  throw new Error("no config");
}
const app = initializeApp(BOOT.firebaseConfig);
const db = getDatabase(app);

function esc(s){ return !s ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(n){ return Math.floor(Number(n || 0)).toLocaleString('fr-FR'); }
function fmtDec(n){ return Number(n || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function stripUrls(txt){
  if (!txt) return '';
  return String(txt).replace(/https?:\/\/\S+/gi, '').replace(/www\.\S+/gi, '').replace(/\s{2,}/g, ' ').trim();
}

/* ═══════════════════════════════════════════
   🧠 استخراج ذكي من نص فوضوي
   ═══════════════════════════════════════════ */
function extractClientData(raw) {
  const out = { name: '', phone: '', address: '' };
  if (!raw) return out;
  let s = stripUrls(String(raw)).replace(/[\u200f\u200e]/g, '').replace(/\s+/g, ' ').trim();
  if (!s) return out;

  const pm = s.match(/(?:الهاتف|هاتف|Télé|Tel|Tél|telephone)\s*:?\s*(\d[\d\s\-]{7,15})/i);
  if (pm) out.phone = pm[1].replace(/[\s\-]/g, '').trim();
  if (!out.phone) {
    const ap = s.match(/(\+?\d{9,15})/);
    if (ap) out.phone = ap[1].replace(/\D/g, '');
  }

  const am = s.match(/(?:العنوان|عنوان|Adresse)\s*:?\s*([^]*?)(?=\s*(?:المنتج|الكمية|السعر|المجموع|Product|Qté|Total|$))/i);
  if (am) {
    let addr = am[1].replace(/[:;|]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
    if (addr.length >= 2 && addr.length <= 150) out.address = addr;
  }

  const nm = s.match(/^([^]*?)(?=\s*(?:الهاتف|هاتف|Télé|Tel|Tél|telephone|العنوان|عنوان|Adresse))/i);
  if (nm) {
    let name = nm[1].replace(/[:;|#]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
    if (name.length >= 2 && name.length <= 50 && !/\d{6,}/.test(name) && !/المنتج|Total|Product|Qté/i.test(name)) {
      out.name = name;
    }
  }
  if (!out.name) {
    const ln = s.match(/^([A-Za-z][A-Za-z\s]{1,40})(?=\s*[A-Z:]|\s*$)/);
    if (ln) out.name = ln[1].trim();
  }
  return out;
}

/* ✅ استخراج رقم هاتف من أي نص فوضوي */
function extractPhoneFromAnywhere(str) {
  if (!str) return '';
  const s = String(str);
  const m1 = s.match(/(?:الهاتف|هاتف|Télé|Tel|Tél)\s*:?\s*(\d{8,15})/i);
  if (m1) return m1[1];
  const m2 = s.match(/(\d{9,15})/);
  if (m2) return m2[1];
  const m3 = s.match(/(\d{8,15})/);
  if (m3) return m3[1];
  return '';
}

function cleanField(val) {
  if (!val) return '';
  let s = stripUrls(String(val)).replace(/[\u200f\u200e]/g, '').replace(/[:;|]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
  if (!s || s.length > 120) return '';
  return s;
}

function isMessy(val) {
  if (!val) return false;
  const s = String(val);
  if (s.length > 60) return true;
  const colons = (s.match(/:/g) || []).length;
  if (colons > 1) return true;
  return /الهاتف|العنوان|المنتج|الكمية|المجموع|Total|Qté/i.test(s);
}

/* ═══════════════════════════════════════════
   ✅ 1) البحث في activity_log عن سجل حذف مطابق
   ═══════════════════════════════════════════ */
async function findFullOrderFromLog(logOrder, logTimestamp) {
  try {
    const snap = await get(ref(db, 'activity_log'));
    if (!snap.exists()) return null;
    const logs = snap.val() || {};

    const messStr = [
      logOrder.customerName || '',
      logOrder.phone || '',
      logOrder.address || ''
    ].join(' ');
    const extractedPhone = extractPhoneFromAnywhere(messStr);
    const logTotal = Number(logOrder.total || logOrder.totalPrice || 0);
    const logTs = logTimestamp || 0;

    let best = null, bestScore = -1;

    Object.entries(logs).forEach(([key, entry]) => {
      if (entry.action !== 'order_delete') return;
      if (!entry.order || typeof entry.order !== 'object') return;
      const o = entry.order;
      if (!Array.isArray(o.items) || !o.items.length) return;

      const oPhone = String(o.phone || '').replace(/\D/g, '');
      const oTotal = Number(o.totalPrice || o.total || 0);
      const oTs = entry.timestamp || 0;

      let score = 0;
      if (extractedPhone && oPhone) {
        if (extractedPhone === oPhone) score += 10;
        else if (oPhone.endsWith(extractedPhone) || extractedPhone.endsWith(oPhone)) score += 5;
      }
      if (logTotal > 0 && oTotal > 0 && Math.abs(oTotal - logTotal) <= 1) score += 5;
      if (oTs >= logTs - 120000) score += 3;
      const logNameL = String(logOrder.customerName || '').toLowerCase();
      const oNameL = String(o.customerName || '').toLowerCase();
      if (logNameL && oNameL && (logNameL.includes(oNameL) || oNameL.includes(logNameL))) score += 2;

      if (score > bestScore && score >= 5) {
        bestScore = score;
        best = o;
      }
    });

    return best;
  } catch (e) {
    console.error('❌ [search]', e);
    return null;
  }
}

/* ═══════════════════════════════════════════
   ✅ 2) البحث في confirmedOrders ثم activity_log
   ═══════════════════════════════════════════ */
async function findFullOrderFromDB(logOrder, logTimestamp) {
  try {
    const snap = await get(ref(db, 'confirmedOrders'));
    if (snap.exists()) {
      const orders = snap.val() || {};
      const messStr = [logOrder.customerName, logOrder.phone, logOrder.address].join(' ');
      const extractedPhone = extractPhoneFromAnywhere(messStr);
      const logTotal = Number(logOrder.total || logOrder.totalPrice || 0);

      let best = null, bestScore = -1;
      Object.entries(orders).forEach(([key, o]) => {
        const oPhone = String(o.phone || '').replace(/\D/g, '');
        const oTotal = Number(o.totalPrice || 0);
        const oTs = o.confirmedAt || o.timestamp || 0;

        let score = 0;
        if (extractedPhone && oPhone && extractedPhone === oPhone) score += 10;
        if (logTotal && oTotal && Math.abs(oTotal - logTotal) <= 1) score += 5;
        const diff = Math.abs(oTs - logTimestamp);
        if (diff < 600000) score += 3;

        if (score > bestScore && score >= 5) { bestScore = score; best = o; }
      });

      if (best) return best;
    }
    return await findFullOrderFromLog(logOrder, logTimestamp);
  } catch (e) {
    console.error('❌ [findFullOrderFromDB]', e);
    return null;
  }
}

async function init(){
  let storeInfo = { name: "", logoUrl: "", phoneInvoice: "", address: "", currency: "دج" };
  try {
    const snap = await get(ref(db, 'store/info'));
    if (snap.exists()) {
      const d = snap.val();
      storeInfo = {
        name: stripUrls(d.name || ""), logoUrl: d.logoUrl || "",
        phoneInvoice: d.phoneInvoice || "", address: stripUrls(d.address || ""),
        currency: d.currency || "دج"
      };
    }
  } catch(e){ console.warn(e); }

  document.title = storeInfo.name ? ("Impression - " + storeInfo.name) : "Impression";

  const stored = sessionStorage.getItem('printDeleted');
  if (!stored) {
    $("loading").style.display = "none";
    $("notice").style.display = "block";
    $("notice").innerHTML = "Aucune donnée à imprimer";
    if ($("actionButtons")) $("actionButtons").style.display = "none";
    return;
  }
  let data;
  try { data = JSON.parse(stored); } catch(e){
    $("loading").style.display = "none";
    $("notice").style.display = "block";
    $("notice").textContent = "Erreur dans les données";
    return;
  }
  sessionStorage.removeItem('printDeleted');

  if (data.storeInfo) {
    storeInfo = {
      name: stripUrls(data.storeInfo.name || storeInfo.name),
      logoUrl: data.storeInfo.logoUrl || storeInfo.logoUrl,
      phoneInvoice: storeInfo.phoneInvoice,
      address: stripUrls(data.storeInfo.address || storeInfo.address),
      currency: data.storeInfo.currency || storeInfo.currency
    };
  }

  const type = data.type || 'order';

  if (type === 'order') {
    const logOrder = data.order || {};
    const hasItems = Array.isArray(logOrder.items) && logOrder.items.length > 0;
    if (!hasItems) {
      const full = await findFullOrderFromDB(logOrder, data.timestamp || Date.now());
      if (full) {
        const merged = Object.assign({}, full);
        if (data.user && !merged.confirmedBy) merged.confirmedBy = data.user;
        data.order = merged;
      }
    }
  }

  if (type === 'product') renderProduct(data, storeInfo);
  else if (type === 'bulk') renderBulk(data, storeInfo);
  else renderOrder(data, storeInfo);
}

/* ═══════════════ 🧾 Bon de livraison ═══════════════ */
function renderOrder(data, storeInfo){
  const container = $("invoiceContainer");
  const order = data.order || {};
  const currency = storeInfo.currency || 'دج';
  const cur = (currency === 'دج' || currency === 'DZD' || currency === 'دينار') ? 'DA' : currency;
  const invoiceNumber = order.invoiceNumber ? String(order.invoiceNumber).padStart(4, '0') : '----';

  let cName = '', cPhone = '', cAddress = '';

  if (order.customerName && !isMessy(order.customerName)) {
    cName = cleanField(order.customerName);
  } else if (order.customerName) {
    cName = extractClientData(order.customerName).name;
  }
  if (order.phone && /^[\d\s+\-()]{6,20}$/.test(String(order.phone).trim())) {
    cPhone = String(order.phone).trim();
  } else if (order.customerName) {
    cPhone = extractClientData(order.customerName).phone;
  }
  if (!cPhone && order.address) cPhone = extractClientData(order.address).phone;
  if (order.address && !isMessy(order.address)) {
    cAddress = cleanField(order.address);
  } else if (order.address) {
    cAddress = extractClientData(order.address).address;
  }
  if (!cAddress && order.customerName) cAddress = extractClientData(order.customerName).address;

  const cWilaya  = cleanField(order.wilaya);
  const cDelivery = cleanField(order.deliveryType);

  const isFreeShip = order.freeShippingApplied === true;
  const shipCost   = Number(order.shippingCost || 0);
  const hasBundle  = order.bundleApplied === true
                  || (Array.isArray(order.items) && order.items.some(it => it.bundleApplied === true));

  const cleanStoreName    = stripUrls(storeInfo.name);
  const cleanStoreAddress = stripUrls(storeInfo.address);

  let rows = '';
  let totalQte = 0;
  let itemIndex = 1;
  if (order.items && Array.isArray(order.items)) {
    order.items.forEach((it) => {
      const qty = Number(it.quantity || 0);
      const price = Number(it.price || 0);
      const total = qty * price;
      totalQte += qty;
      const bundleMark = it.bundleApplied ? ' [Offre]' : '';
      rows += `<tr>
          <td style="text-align:center; border:1px solid #000; padding:2px 4px;">${itemIndex}</td>
          <td style="border:1px solid #000; padding:2px 4px; text-align:left; direction:ltr; font-weight:600;">${esc(it.name)}${bundleMark}</td>
          <td style="text-align:center; border:1px solid #000; padding:2px 4px;">${qty}</td>
          <td style="text-align:right; border:1px solid #000; padding:2px 4px; direction:ltr; white-space:nowrap; font-size:10px;">${fmt(price)} ${esc(cur)}</td>
          <td style="text-align:right; border:1px solid #000; padding:2px 4px; direction:ltr; white-space:nowrap; font-size:10px;">${fmt(total)} ${esc(cur)}</td>
        </tr>`;
      itemIndex++;
    });
  }

  const totalPrice = Number(order.totalPrice || order.total || 0);
  const nbreProduit = order.items ? order.items.length : 0;
  const sellerName = stripUrls(order.confirmedBy || data.user || 'Admin');
  const now = new Date(order.confirmedAt || data.timestamp || Date.now());
  const dateStr = now.toLocaleDateString('fr-FR');
  const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

  const locationSuffix = (cWilaya || cDelivery) ? ' - ' + [cWilaya, cDelivery].filter(Boolean).join(' / ') : '';
  let shippingLineHtml = '';
  if (isFreeShip) {
    shippingLineHtml = `<div class="shipping-line">Frais de livraison : <span class="free">Gratuite</span>${esc(locationSuffix)}</div>`;
  } else if (shipCost > 0) {
    shippingLineHtml = `<div class="shipping-line">Frais de livraison : ${fmt(shipCost)} ${esc(cur)}${esc(locationSuffix)}</div>`;
  } else if (cWilaya || cDelivery) {
    shippingLineHtml = `<div class="shipping-line">Livraison : ${esc([cWilaya, cDelivery].filter(Boolean).join(' / '))}</div>`;
  }

  const logoHtml = storeInfo.logoUrl
    ? `<div class="store-logo"><img src="${esc(storeInfo.logoUrl)}" alt="Logo" onerror="this.style.display='none'"></div>` : '';
  const phoneHtml = storeInfo.phoneInvoice ? `<p>Télé : ${esc(storeInfo.phoneInvoice)}</p>` : '';
  const addressHtml = cleanStoreAddress ? `<p>${esc(cleanStoreAddress)}</p>` : '';

  container.innerHTML = `
    <div class="top-header">
      <div class="store-info">
        ${logoHtml}
        <div class="store-details">
          <h2>${esc(cleanStoreName) || '—'}</h2>
          ${phoneHtml}
          ${addressHtml}
        </div>
      </div>
      <div class="client-info">
        <p><strong>Client :</strong> ${esc(cName) || '—'}</p>
        <p><strong>Adresse :</strong> ${esc(cAddress) || '—'}</p>
        <p><strong>Télé :</strong> ${esc(cPhone) || '—'}</p>
        ${cWilaya ? `<p><strong>Wilaya :</strong> ${esc(cWilaya)}</p>` : ''}
        ${cDelivery ? `<p><strong>Type de livraison :</strong> ${esc(cDelivery)}</p>` : ''}
      </div>
    </div>
    <div class="info-bar">
      <span>le ${dateStr} - ${timeStr}</span>
      <span>Préparé par : ${esc(sellerName)}</span>
    </div>
    <div class="doc-title">Bon de livraison</div>
    <table>
      <thead><tr>
          <th style="width:5%">N°</th>
          <th style="width:48%">DESIGNATION</th>
          <th style="width:7%">QTE</th>
          <th style="width:20%">Prix u</th>
          <th style="width:20%">Total</th>
      </tr></thead>
      <tbody>${rows || `<tr><td colspan="5" style="text-align:center;padding:10px;">Aucun produit</td></tr>`}</tbody>
    </table>
    <div class="summary-line">Nbre Produit : ${nbreProduit} &nbsp;&nbsp;&nbsp; Tot Qté : ${totalQte}</div>
    ${hasBundle ? `<div class="summary-line" style="font-size:10px;">Dont articles avec offre quantité</div>` : ''}
    <div class="footer-wrapper">
      <div class="bottom-section">
        <div class="invoice-number">bon de livraison N°: ${invoiceNumber}</div>
        <div class="total-box">
          ${shippingLineHtml}
          <div><strong>net à payer</strong></div>
          <div class="total-amount">${fmtDec(totalPrice)} ${esc(cur)}</div>
        </div>
      </div>
      <div class="footer-text">Merci pour votre confiance</div>
    </div>
  `;
  $("loading").style.display = "none";
  container.style.display = "block";
}

/* ═══════════════ 📦 Fiche produit supprimé ═══════════════ */
function renderProduct(data, storeInfo){
  const container = $("invoiceContainer");
  const product = data.product || {};
  const currency = storeInfo.currency || 'دج';
  const cur = (currency === 'دج' || currency === 'DZD' || currency === 'دينار') ? 'DA' : currency;
  const cleanStoreName = stripUrls(storeInfo.name);
  const cleanStoreAddress = stripUrls(storeInfo.address);
  const cleanProductName = stripUrls(product.name || '—');
  const cleanFamily = stripUrls(product.family || '');
  const logoHtml = storeInfo.logoUrl ? `<div class="store-logo"><img src="${esc(storeInfo.logoUrl)}" alt="" onerror="this.style.display='none'"></div>` : '';
  const phoneHtml = storeInfo.phoneInvoice ? `<p>Télé : ${esc(storeInfo.phoneInvoice)}</p>` : '';
  const addressHtml = cleanStoreAddress ? `<p>${esc(cleanStoreAddress)}</p>` : '';
  const now = new Date(data.timestamp || Date.now());
  const dateStr = now.toLocaleDateString('fr-FR');
  const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  container.innerHTML = `
    <div class="top-header">
      <div class="store-info">${logoHtml}<div class="store-details"><h2>${esc(cleanStoreName) || '—'}</h2>${phoneHtml}${addressHtml}</div></div>
      <div class="client-info">
        <p><strong>Type :</strong> Produit supprimé</p>
        <p><strong>Date :</strong> ${dateStr} - ${timeStr}</p>
        <p><strong>Utilisateur :</strong> ${esc(data.user || '—')}</p>
      </div>
    </div>
    <div class="info-bar"><span>le ${dateStr} - ${timeStr}</span><span>Effectué par : ${esc(data.user || '—')}</span></div>
    <div class="doc-title">FICHE PRODUIT SUPPRIMÉ</div>
    <table><thead><tr><th style="width:30%">Champ</th><th style="width:70%">Valeur</th></tr></thead>
      <tbody>
        <tr><td style="font-weight:700;">Nom du produit</td><td>${esc(cleanProductName)}</td></tr>
        ${cleanFamily ? `<tr><td style="font-weight:700;">Famille</td><td>${esc(cleanFamily)}</td></tr>` : ''}
        ${product.price != null ? `<tr><td style="font-weight:700;">Prix de vente</td><td>${fmt(product.price)} ${esc(cur)}</td></tr>` : ''}
        ${product.wholesalePrice != null ? `<tr><td style="font-weight:700;">Prix de gros</td><td>${fmt(product.wholesalePrice)} ${esc(cur)}</td></tr>` : ''}
        ${product.costPrice != null ? `<tr><td style="font-weight:700;">Prix d'achat</td><td>${fmt(product.costPrice)} ${esc(cur)}</td></tr>` : ''}
        ${product.stockQuantity != null ? `<tr><td style="font-weight:700;">Quantité</td><td>${fmt(product.stockQuantity)}</td></tr>` : ''}
      </tbody>
    </table>
    <div class="footer-wrapper"><div class="bottom-section">
      <div class="invoice-number">Fiche produit · ${dateStr}</div>
      <div class="total-box"><div><strong>Produit supprimé du stock</strong></div><div class="total-amount" style="font-size:13px;">${esc(cleanProductName)}</div></div>
    </div><div class="footer-text">Document généré automatiquement</div></div>
  `;
  $("loading").style.display = "none";
  container.style.display = "block";
}

/* ═══════════════ 📊 Bulk ═══════════════ */
function renderBulk(data, storeInfo){
  const container = $("invoiceContainer");
  const currency = storeInfo.currency || 'دج';
  const cur = (currency === 'دج' || currency === 'DZD' || currency === 'دينار') ? 'DA' : currency;
  const bulk = data.bulkInfo || {};
  const cleanStoreName = stripUrls(storeInfo.name);
  const cleanStoreAddress = stripUrls(storeInfo.address);
  const bulkLabel = stripUrls(bulk.label || '—');
  const isOrders = bulk.type === 'orders';
  const logoHtml = storeInfo.logoUrl ? `<div class="store-logo"><img src="${esc(storeInfo.logoUrl)}" alt="" onerror="this.style.display='none'"></div>` : '';
  const phoneHtml = storeInfo.phoneInvoice ? `<p>Télé : ${esc(storeInfo.phoneInvoice)}</p>` : '';
  const addressHtml = cleanStoreAddress ? `<p>${esc(cleanStoreAddress)}</p>` : '';
  const now = new Date(data.timestamp || Date.now());
  const dateStr = now.toLocaleDateString('fr-FR');
  const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const count = Number(bulk.count || 0);
  container.innerHTML = `
    <div class="top-header">
      <div class="store-info">${logoHtml}<div class="store-details"><h2>${esc(cleanStoreName) || '—'}</h2>${phoneHtml}${addressHtml}</div></div>
      <div class="client-info">
        <p><strong>Type :</strong> Suppression groupée</p>
        <p><strong>Catégorie :</strong> ${isOrders ? 'Commandes' : 'Produits'}</p>
        <p><strong>Date :</strong> ${dateStr} - ${timeStr}</p>
        <p><strong>Utilisateur :</strong> ${esc(data.user || '—')}</p>
      </div>
    </div>
    <div class="info-bar"><span>le ${dateStr} - ${timeStr}</span><span>Effectué par : ${esc(data.user || '—')}</span></div>
    <div class="doc-title">RAPPORT DE SUPPRESSION GROUPÉE</div>
    <table><thead><tr><th style="width:40%">Description</th><th style="width:60%">Détail</th></tr></thead>
      <tbody>
        <tr><td style="font-weight:700;">Opération</td><td>${esc(bulkLabel)}</td></tr>
        ${!isOrders && count > 0 ? `<tr><td style="font-weight:700;">Nombre de produits</td><td><b>${fmt(count)}</b></td></tr>` : ''}
        ${isOrders ? `<tr><td style="font-weight:700;">Nombre de commandes</td><td><b>Toutes les commandes confirmées</b></td></tr>` : ''}
      </tbody>
    </table>
    <div class="footer-wrapper"><div class="bottom-section">
      <div class="invoice-number">Rapport · ${dateStr}</div>
      <div class="total-box"><div><strong>Total</strong></div><div class="total-amount">${isOrders ? 'Commandes' : fmt(count) + ' produit(s)'}</div></div>
    </div><div class="footer-text">Document généré automatiquement</div></div>
  `;
  $("loading").style.display = "none";
  container.style.display = "block";
}

init();
</script>
</body>
</html>
