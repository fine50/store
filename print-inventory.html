<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impression Inventaire</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', Arial, sans-serif; font-size: 12px; background: white; padding: 10px; direction: ltr; }
    .invoice { max-width: 1000px; margin: 0 auto; padding: 12px; }
    .top-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
    .store-info { display: flex; align-items: center; gap: 10px; width: 55%; }
    .store-logo img { width: 50px; height: 50px; object-fit: contain; }
    .store-details h2 { font-size: 14px; font-weight: 900; margin-bottom: 3px; }
    .store-details p { font-size: 10px; margin: 2px 0; }
    .report-info { width: 40%; border: 1px solid #000; padding: 6px 10px; line-height: 1.4; font-size: 11px; direction: ltr; }
    .report-info p { margin: 2px 0; text-align: left; }
    .info-bar { display: flex; justify-content: space-between; margin-bottom: 15px; padding: 5px 0; font-size: 11px; font-weight: 600; direction: ltr; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; direction: ltr; }
    th, td { border: 1px solid #000; padding: 3px 5px; font-size: 11px; }
    th { background: #f4f4f4; font-weight: 700; text-align: center; }
    td.num { direction: ltr; text-align: right; }
    td.name { direction: ltr; text-align: left; font-weight: 600; }
    td.ctr { text-align: center; }
    .summary-line { margin: 8px 0; text-align: right; font-weight: 600; font-size: 11px; direction: ltr; }
    .footer-wrapper { break-inside: avoid; page-break-inside: avoid; margin-top: 18px; }
    .bottom-section { display: flex; justify-content: flex-end; align-items: flex-end; border-top: 3px solid #000; padding-top: 14px; direction: ltr; }
    .total-box { text-align: right; min-width: 260px; }
    .total-box strong { font-size: 12px; }
    .total-amount { font-size: 16px; font-weight: 900; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; border: 1px solid #000; }
    .badge-ok { background: #d1fae5; }
    .badge-low { background: #fef3c7; }
    .badge-out { background: #fee2e2; }
    @media print {
      @page { size: A4; margin: 12mm 10mm; }
      body { padding: 0; }
      .invoice { padding: 0; max-width: 100%; }
      .no-print { display: none !important; }
      .badge, th, td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    #loading{text-align:center; padding:60px; color:#0b6e4f; font-weight:700;}
    #loading .spin{width:40px; height:40px; border:4px solid #e9edf2; border-top-color:#0b6e4f; border-radius:50%; animation:spin .9s linear infinite; margin:0 auto 16px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    #notice{text-align:center; padding:60px; color:#e74c3c; font-weight:700;}
  </style>
</head>
<body>
  <div id="loading"><div class="spin"></div><span>Chargement...</span></div>
  <div id="notice" style="display:none"></div>
  <div id="invoiceContainer" class="invoice" style="display:none;"></div>
  <div class="no-print" style="text-align:center; margin:20px 0;" id="actionButtons">
    <button onclick="window.print()" style="padding:10px 25px; font-size:14px; margin:5px; background:#000; color:white; border:none; border-radius:5px; cursor:pointer;">Imprimer</button>
    <button onclick="window.close()" style="padding:10px 25px; font-size:14px; margin:5px; background:#e5e7eb; border:none; border-radius:5px; cursor:pointer;">Fermer</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const $ = id => document.getElementById(id);
const BOOT = window.STORE_BOOTSTRAP;
if (!BOOT || !BOOT.firebaseConfig || String(BOOT.firebaseConfig.apiKey).includes("YOUR_")) {
  $("loading").style.display = "none";
  $("notice").style.display = "block";
  $("notice").textContent = "Fichier config.js manquant ou non configuré";
  throw new Error("no config");
}
const app = initializeApp(BOOT.firebaseConfig);
const db = getDatabase(app);

function esc(s){ return !s ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(n){ return Math.floor(Number(n || 0)).toLocaleString('fr-FR'); }

/* ─── Suppression défensive des URLs ─── */
function stripUrls(txt){
  if (!txt) return '';
  return String(txt)
    .replace(/https?:\/\/\S+/gi, '')
    .replace(/www\.\S+/gi, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

/* ─── Retire les emojis d'un texte ─── */
const EMOJI_RE = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
function stripEmoji(s){ return String(s || '').replace(EMOJI_RE, '').trim(); }

/* ═══ Dictionnaire de traduction (les titres arrivent en arabe depuis l'admin) ═══ */
const AR_TO_FR = {
  "تفاصيل المبيعات": "Détails des ventes",
  "تفاصيل الطلبات": "Détails des commandes",
  "تفاصيل الأرباح": "Détails des bénéfices",
  "تفاصيل التكلفة": "Détails des coûts",
  "تفاصيل قيمة المخزون": "Valeur du stock",
  "تفاصيل الكميات": "Détails des quantités",
  "منتجات على وشك النفاد": "Produits bientôt épuisés",
  "منتجات نفدت": "Produits épuisés",
  "اليوم": "Aujourd'hui",
  "هذا الأسبوع": "Cette semaine",
  "هذا الشهر": "Ce mois",
  "هذه السنة": "Cette année",
  "كل الفترات": "Toutes les périodes",
  "الكل": "Tout",
  "نفد": "Épuisé",
  "منخفض": "Faible",
  "متوفر": "En stock",
  "الإجمالي": "Total",
  "العميل": "Client",
  "الهاتف": "Téléphone",
  "العنوان": "Adresse",
  "المبلغ": "Montant",
  "التاريخ": "Date",
  "المنتج": "Produit",
  "الكمية": "Qté",
  "الكمية المباعة": "Qté vendue",
  "ثمن الشراء": "Prix d'achat",
  "سعر البيع": "Prix de vente",
  "الفائدة/قطعة": "Marge/pièce",
  "التكلفة": "Coût",
  "الربح": "Bénéfice",
  "المبيعات": "Ventes",
  "الحالة": "Statut",
  "حد التنبيه": "Seuil alerte",
  "لا توجد بيانات في هذه الفترة": "Aucune donnée pour cette période",
  "لا توجد مبيعات في هذه الفترة": "Aucune vente pour cette période"
};

/* Normalisation : dictionnaire indexé à la fois avec et sans emoji */
const AR_TO_FR_NORM = {};
Object.entries(AR_TO_FR).forEach(([k, v]) => {
  AR_TO_FR_NORM[k] = v;
  AR_TO_FR_NORM[stripEmoji(k)] = v;
});

const PATTERNS = [
  { regex: /^الفترة\s*:?\s*(.+)$/, fn: (m, p) => `Période : ${AR_TO_FR_NORM[stripEmoji(p)] || stripEmoji(p)}` },
  { regex: /^(\d+)\s*قطعة$/, fn: (m, n) => `${n} pièce(s)` },
  { regex: /^(\d+)\s*منتج$/, fn: (m, n) => `${n} produit(s)` },
  { regex: /^(\d+)\s*طلب$/, fn: (m, n) => `${n} commande(s)` }
];

function translateLabel(text) {
  if (!text) return text;
  const clean = stripEmoji(text);
  if (!clean) return '';
  if (AR_TO_FR_NORM[clean]) return AR_TO_FR_NORM[clean];
  for (const p of PATTERNS) {
    const m = clean.match(p.regex);
    if (m) return p.fn(...m);
  }
  /* Si le texte contient encore des caractères arabes, on renvoie une chaîne vide pour ne rien afficher en arabe */
  if (/[\u0600-\u06FF]/.test(clean)) return '';
  return clean;
}

async function init(){
  let storeInfo = { name:"", logoUrl:"", phoneInvoice:"", address:"", currency:"دج" };
  try {
    const snap = await get(ref(db, 'store/info'));
    if (snap.exists()) {
      const d = snap.val();
      storeInfo = {
        name: stripUrls(d.name || ""),
        logoUrl: d.logoUrl || "",
        phoneInvoice: d.phoneInvoice || "",
        address: stripUrls(d.address || ""),
        currency: d.currency || "دج"
      };
    }
  } catch(e){ console.warn(e); }

  document.title = storeInfo.name ? ("Inventaire - " + storeInfo.name) : "Inventaire";

  const stored = sessionStorage.getItem('printInventory');
  if (!stored) {
    $("loading").style.display = "none";
    $("notice").style.display = "block";
    $("notice").innerHTML = "Aucune donnée à imprimer<br><small>Ouvrez cette page depuis le panneau d'administration</small>";
    if ($("actionButtons")) $("actionButtons").style.display = "none";
    return;
  }

  let data;
  try { data = JSON.parse(stored); }
  catch(e){ $("loading").style.display = "none"; $("notice").style.display = "block"; $("notice").textContent = "Erreur dans les données"; return; }
  sessionStorage.removeItem('printInventory');

  renderReport(data, storeInfo);
}

function renderReport(data, storeInfo){
  const container = $("invoiceContainer");
  const currency = storeInfo.currency || 'دج';
  const cur = (currency === 'دج' || currency === 'DZD' || currency === 'دينار') ? 'DA' : currency;
  const type = data.type || 'stock';
  const periodLabel = translateLabel(data.periodLabel || 'Toutes les périodes');
  const title = translateLabel(data.title || 'Rapport');

  /* ✅ Seuil d'alerte : on utilise celui envoyé depuis l'admin (session), jamais une valeur fixe */
  const lowStockAlert = Number(data.lowStockAlert) || 5;

  let headCols = '', rows = '';
  const canSeeCost = data.canSeeCost !== false;
  const items = Array.isArray(data.rows) ? data.rows : [];

  if (type === 'revenue' || type === 'orders') {
    headCols = `<th style="width:6%">N°</th><th style="width:30%">Client</th><th style="width:20%">Téléphone</th><th style="width:18%">Montant</th><th style="width:26%">Date</th>`;
    items.forEach((r, i) => {
      rows += `<tr><td class="ctr">${i+1}</td><td class="name">${esc(r[0])}</td><td class="ctr">${esc(r[1])}</td><td class="num">${esc(r[2])}</td><td class="ctr" style="font-size:10px;">${esc(r[3])}</td></tr>`;
    });
  }
  else if (type === 'profit' || type === 'cost') {
    if (canSeeCost) headCols = `<th style="width:5%">N°</th><th style="width:40%">Désignation</th><th style="width:10%">Qté</th><th style="width:15%">Ventes</th><th style="width:15%">Coût</th><th style="width:15%">Bénéfice</th>`;
    else headCols = `<th style="width:6%">N°</th><th style="width:64%">Désignation</th><th style="width:15%">Qté</th><th style="width:15%">Ventes</th>`;
    items.forEach((r, i) => {
      const qty = Number(r[1]) || 0;
      /* ✅ Utilise le seuil d'alerte configuré dans les paramètres */
      const qtyStyle = qty <= lowStockAlert ? 'background:#f1f5f9;' : '';
      if (canSeeCost) {
        rows += `<tr><td class="ctr">${i+1}</td><td class="name">${esc(r[0])}</td><td class="ctr" style="${qtyStyle}">${esc(r[1])}</td><td class="num">${esc(r[2])}</td><td class="num">${esc(r[3])}</td><td class="num" style="font-weight:700;">${esc(r[4])}</td></tr>`;
      } else {
        rows += `<tr><td class="ctr">${i+1}</td><td class="name">${esc(r[0])}</td><td class="ctr" style="${qtyStyle}">${esc(r[1])}</td><td class="num">${esc(r[2])}</td></tr>`;
      }
    });
  }
  else if (type === 'stockValue' || type === 'stockQty') {
    if (canSeeCost) headCols = `<th style="width:5%">N°</th><th style="width:45%">Désignation</th><th style="width:12%">Qté</th><th style="width:18%">Prix achat</th><th style="width:20%">Valeur</th>`;
    else headCols = `<th style="width:6%">N°</th><th style="width:70%">Désignation</th><th style="width:24%">Qté</th>`;
    items.forEach((r, i) => {
      const qty = Number(r[1]) || 0;
      /* ✅ Utilise le seuil d'alerte configuré dans les paramètres */
      const qtyStyle = qty <= lowStockAlert ? 'background:#f1f5f9;' : '';
      if (canSeeCost) {
        rows += `<tr><td class="ctr">${i+1}</td><td class="name">${esc(r[0])}</td><td class="ctr" style="${qtyStyle}">${esc(r[1])}</td><td class="num">${esc(r[2])}</td><td class="num" style="font-weight:700;">${esc(r[3])}</td></tr>`;
      } else {
        rows += `<tr><td class="ctr">${i+1}</td><td class="name">${esc(r[0])}</td><td class="ctr" style="${qtyStyle}">${esc(r[1])}</td></tr>`;
      }
    });
  }
  else {
    headCols = `<th style="width:5%">N°</th><th style="width:45%">Désignation</th><th style="width:15%">Qté dispo</th><th style="width:15%">Seuil alerte</th><th style="width:20%">Statut</th>`;
    items.forEach((r, i) => {
      const qty = Number(r[1]);
      const alert = Number(r[2]) || lowStockAlert;
      const statusText = translateLabel(r[3]) || (qty === 0 ? 'Épuisé' : qty <= alert ? 'Faible' : 'En stock');
      let badgeClass = 'badge-ok';
      if (qty === 0) badgeClass = 'badge-out';
      else if (qty <= alert) badgeClass = 'badge-low';
      rows += `<tr><td class="ctr">${i+1}</td><td class="name">${esc(r[0])}</td><td class="ctr" style="font-weight:700; color:${qty === 0 ? '#dc2626' : qty <= alert ? '#d97706' : '#059669'};">${qty}</td><td class="ctr">${alert}</td><td class="ctr"><span class="badge ${badgeClass}">${esc(statusText)}</span></td></tr>`;
    });
  }

  if (!items.length) rows = `<tr><td colspan="6" style="text-align:center; padding:12px;">Aucune donnée disponible</td></tr>`;

  const logoHtml = storeInfo.logoUrl ? `<div class="store-logo"><img src="${esc(storeInfo.logoUrl)}" onerror="this.style.display='none'"></div>` : '';
  const phoneHtml = storeInfo.phoneInvoice ? `<p>Télé : ${esc(storeInfo.phoneInvoice)}</p>` : '';
  const addressHtml = storeInfo.address ? `<p>${esc(storeInfo.address)}</p>` : '';
  const now = new Date();
  const dateStr = now.toLocaleDateString('fr-FR');
  const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const totalLine = data.total ? `<div class="total-box"><div><strong>${translateLabel(data.total) || 'Total'}</strong></div><div class="total-amount">${esc(data.totalValue || '0')}</div></div>` : '';

  container.innerHTML = `
    <div class="top-header">
      <div class="store-info">${logoHtml}<div class="store-details"><h2>${esc(storeInfo.name) || '—'}</h2>${phoneHtml}${addressHtml}</div></div>
      <div class="report-info">
        <p><strong>Type :</strong> ${esc(title)}</p>
        <p><strong>Période :</strong> ${esc(periodLabel)}</p>
        <p><strong>Date :</strong> ${dateStr} - ${timeStr}</p>
        <p><strong>Articles :</strong> ${items.length}</p>
      </div>
    </div>
    <div class="info-bar"><span>Édité le ${dateStr} à ${timeStr}</span><span>Rapport d'inventaire</span></div>
    <div style="text-align:center; margin:10px 0; font-weight:bold; font-size:14px; direction:ltr;">${esc(title)}</div>
    <table><thead><tr>${headCols}</tr></thead><tbody>${rows}</tbody></table>
    <div class="summary-line">Nombre d'articles : ${items.length}</div>
    <div class="footer-wrapper">
      <div class="bottom-section">
        ${totalLine}
      </div>
    </div>`;

  $("loading").style.display = "none";
  container.style.display = "block";
}

init();
</script>
</body>
</html>
