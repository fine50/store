<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<title>استيراد المنتجات من Excel</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="config.js"></script>
<link rel="stylesheet" href="admin.css" />
<style>
/* ═══ إضافات بسيطة فقط — الباقي من admin.css ═══ */
body {
  padding-bottom: 24px !important;
  overflow-x: hidden;
}

.import-container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

/* Header — يستخدم ستايل admin */
header.import-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
}
header.import-header .logo {
  min-width: 0;
  flex: 1;
}
header.import-header .logo img {
  height: 2.4rem;
  width: auto;
  max-width: 70px;
  object-fit: contain;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
header.import-header .header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 14px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-2);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  text-decoration: none;
  transition: all var(--dur) var(--ease);
  flex-shrink: 0;
}
.back-btn:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* Step Card */
.step-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-xs);
  animation: fadeIn var(--dur) var(--ease);
}
.step-card.hidden { display: none !important; }

.step-title {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 800;
  font-size: 1rem;
  color: var(--text);
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  letter-spacing: -.01em;
}
.step-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .85rem;
  font-weight: 800;
  flex-shrink: 0;
}

/* Upload Zone */
.upload-zone {
  display: block;
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-md);
  padding: 44px 24px;
  text-align: center;
  background: var(--bg-2);
  cursor: pointer;
  transition: all var(--dur) var(--ease);
  width: 100%;
}
.upload-zone:hover,
.upload-zone.drag-over {
  border-color: var(--primary);
  background: var(--primary-tint);
  transform: translateY(-1px);
}
.upload-zone i {
  font-size: 3rem;
  color: var(--primary);
  margin-bottom: 14px;
  display: block;
}
.upload-zone h3 {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}
.upload-zone p {
  font-size: .88rem;
  color: var(--text-2);
  margin-bottom: 4px;
}
.upload-zone .formats {
  margin-top: 12px;
  font-size: .78rem;
  color: var(--muted);
  font-weight: 600;
}

/* File Info Bar */
.file-info {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--primary-tint);
  border: 1px solid var(--primary-100);
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.file-info > i {
  font-size: 1.4rem;
  color: var(--primary);
  flex-shrink: 0;
}
.file-info .fname {
  flex: 1;
  min-width: 0;
  font-weight: 700;
  font-size: .9rem;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-info .fsize {
  font-size: .78rem;
  color: var(--text-3);
  font-weight: 600;
  flex-shrink: 0;
}
.file-info .reset-btn {
  padding: 7px 14px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: .78rem;
  font-weight: 700;
  color: var(--danger);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all var(--dur) var(--ease);
}
.file-info .reset-btn:hover {
  background: var(--danger-tint);
  border-color: var(--danger);
}

/* Mapping Cards */
.mapping-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 640px) {
  .mapping-list { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1024px) {
  .mapping-list { grid-template-columns: repeat(3, 1fr); }
}

.mapping-card {
  background: var(--bg-2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: border-color var(--dur) var(--ease),
              background var(--dur) var(--ease);
}
.mapping-card:hover {
  background: #fff;
  border-color: var(--border-strong);
}
.mapping-card .col-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 10px;
  border-bottom: 1px dashed var(--border);
}
.mapping-card .col-index {
  width: 26px;
  height: 26px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--primary), var(--primary-600));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .72rem;
  font-weight: 800;
  flex-shrink: 0;
}
.mapping-card .col-name {
  font-weight: 800;
  font-size: .9rem;
  color: var(--text);
  flex: 1;
  min-width: 0;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.mapping-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.mapping-field-label {
  font-size: .7rem;
  font-weight: 800;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .5px;
}

.type-select {
  width: 100%;
  height: 44px;
  padding: 10px 38px 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 15px;
  font-weight: 700;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: left 14px center;
  background-size: 14px;
  transition: all var(--dur) var(--ease);
}
.type-select:focus {
  border-color: var(--primary);
  box-shadow: var(--shadow-focus);
  background-color: #fff;
}
.type-select.detected {
  background-color: var(--primary-50);
  border-color: var(--primary-200);
  color: var(--primary-600);
}
.type-select.manual {
  background-color: var(--warning-tint);
  border-color: #fed7aa;
  color: #9a3412;
}
.type-select.ignored {
  background-color: var(--bg-2);
  border-color: var(--border-strong);
  color: var(--text-3);
}

.mapping-sample {
  font-size: .76rem;
  color: var(--text-2);
  background: #fff;
  border: 1px solid var(--border);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  word-break: break-word;
  overflow-wrap: anywhere;
  line-height: 1.5;
  min-height: 40px;
  display: flex;
  align-items: center;
}
.mapping-sample.empty {
  color: var(--muted);
  font-style: italic;
}

/* Alert Boxes */
.alert-box {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: .85rem;
  font-weight: 700;
  margin-bottom: 14px;
  line-height: 1.55;
  border: 1px solid;
}
.alert-box i {
  font-size: 1rem;
  margin-top: 3px;
  flex-shrink: 0;
}
.alert-box > div { flex: 1; min-width: 0; }
.alert-warn { background: var(--warning-tint); border-color: #fcd34d; color: #92400e; }
.alert-warn i { color: var(--warning); }
.alert-error { background: var(--danger-tint); border-color: #fca5a5; color: #991b1b; }
.alert-error i { color: var(--danger); }
.alert-success { background: var(--success-tint); border-color: #6ee7b7; color: #065f46; }
.alert-success i { color: #059669; }
.alert-info { background: var(--info-tint); border-color: #93c5fd; color: #1e40af; }
.alert-info i { color: var(--info); }

/* Preview Grid */
.preview-section {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.preview-section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: .9rem;
  color: var(--text);
  margin-bottom: 12px;
}
.preview-section-title i { color: var(--primary); }

.preview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 12px;
}
.preview-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: all var(--dur) var(--ease);
  box-shadow: var(--shadow-xs);
}
.preview-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
  border-color: var(--border-strong);
}
.preview-card img,
.preview-card .no-img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: var(--bg-2);
  flex-shrink: 0;
}
.preview-card .no-img {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--border-strong);
  font-size: 2.4rem;
}
.preview-card .info {
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
}
.preview-card .pname {
  font-weight: 800;
  font-size: .84rem;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.preview-card .pline {
  font-size: .74rem;
  color: var(--text-3);
  display: flex;
  justify-content: space-between;
  gap: 6px;
  align-items: baseline;
}
.preview-card .pline b {
  color: var(--text);
  font-weight: 800;
}
.preview-card .pline.price b { color: var(--primary); font-size: .86rem; }
.preview-card .pline.purchase b { color: var(--danger); }
.preview-card .pline.wholesale b { color: #7c3aed; }

/* Actions Row */
.actions-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.actions-row .btn-primary,
.actions-row .btn-secondary,
.actions-row .btn-success {
  flex: 1;
  min-width: 140px;
}

/* Progress Bar */
.import-progress {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  margin-top: 18px;
  box-shadow: var(--shadow-xs);
}
.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-weight: 800;
  font-size: .88rem;
  color: var(--text);
}
.progress-header .percent {
  color: var(--primary);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
}
.progress-bar-track {
  width: 100%;
  height: 10px;
  background: var(--bg-2);
  border-radius: 9999px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--primary), #34d399);
  border-radius: 9999px;
  transition: width .25s var(--ease);
}
.progress-detail {
  margin-top: 10px;
  font-size: .78rem;
  color: var(--text-3);
  font-family: monospace;
  font-variant-numeric: tabular-nums;
}

/* Result Stats */
.result-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-top: 16px;
}
.result-stat {
  text-align: center;
  padding: 18px 12px;
  border-radius: var(--radius-md);
  border: 1.5px solid;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.result-stat .val {
  font-size: 1.7rem;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.result-stat .lbl {
  font-size: .76rem;
  font-weight: 700;
}
.result-stat.success { background: var(--success-tint); border-color: #86efac; }
.result-stat.success .val, .result-stat.success .lbl { color: #065f46; }
.result-stat.info { background: var(--info-tint); border-color: #93c5fd; }
.result-stat.info .val, .result-stat.info .lbl { color: #1e40af; }
.result-stat.warning { background: var(--warning-tint); border-color: #fcd34d; }
.result-stat.warning .val, .result-stat.warning .lbl { color: #92400e; }
.result-stat.muted { background: var(--bg-2); border-color: var(--border-strong); }
.result-stat.muted .val, .result-stat.muted .lbl { color: var(--text-3); }

.added-list-box {
  margin-top: 16px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
}
.added-list-title {
  font-weight: 800;
  font-size: .86rem;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.added-list-title i { color: var(--primary); }
.added-list-content {
  max-height: 220px;
  overflow-y: auto;
  font-size: .82rem;
  line-height: 1.9;
  color: var(--text-2);
  padding-inline-end: 6px;
}
.added-list-content .item {
  display: flex;
  gap: 6px;
  align-items: baseline;
  padding: 2px 0;
  border-bottom: 1px dashed var(--border-2);
}
.added-list-content .item:last-child { border-bottom: none; }
.added-list-content .item b {
  color: var(--muted);
  font-weight: 700;
  font-size: .74rem;
  flex-shrink: 0;
  min-width: 28px;
}

/* Responsive */
@media (max-width: 640px) {
  .import-container { padding: 14px 12px 30px; }
  .step-card { padding: 16px; }
  .upload-zone { padding: 32px 16px; }
  .upload-zone i { font-size: 2.4rem; }
  .upload-zone h3 { font-size: .95rem; }
  .preview-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); }
  .result-stat .val { font-size: 1.4rem; }
  .actions-row .btn-primary,
  .actions-row .btn-secondary,
  .actions-row .btn-success { width: 100%; min-width: 0; }
  header.import-header { padding: 10px 12px; }
  header.import-header .logo img { height: 2rem; max-width: 50px; }
  .back-btn span { display: none; }
  .back-btn { padding: 8px 10px; }
}
</style>
</head>
<body>

<!-- ═══════════════ HEADER ═══════════════ -->
<header class="import-header">
  <div class="logo">
    <img id="headerLogo" style="display:none;" alt="" />
    <span id="headerStoreName">...</span>
  </div>
  <div class="header-actions">
    <a href="admin.html" class="back-btn" title="رجوع">
      <i class="fas fa-arrow-right" id="backIcon"></i>
      <span>رجوع</span>
    </a>
  </div>
</header>

<!-- ═══════════════ MAIN ═══════════════ -->
<div class="import-container">

  <!-- Step 1: Upload -->
  <div class="step-card" id="stepUpload">
    <div class="step-title">
      <span class="step-num">1</span>
      <span>رفع ملف Excel</span>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none;" />
    <label class="upload-zone" id="uploadZone" for="fileInput">
      <i class="fas fa-file-excel"></i>
      <h3>اضغط هنا لاختيار الملف</h3>
      <p>أو اسحب الملف وأفلته هنا</p>
      <p class="formats">الصيغ المدعومة: .xlsx, .xls, .csv</p>
    </label>
  </div>

  <!-- Step 2: Mapping -->
  <div class="step-card hidden" id="stepMapping">
    <div class="step-title">
      <span class="step-num">2</span>
      <span>مراجعة الأعمدة</span>
    </div>

    <div class="file-info">
      <i class="fas fa-file-excel"></i>
      <span class="fname" id="fileName">-</span>
      <span class="fsize" id="fileSize">-</span>
      <button type="button" class="reset-btn" id="btnReset">
        <i class="fas fa-times"></i> ملف آخر
      </button>
    </div>

    <div id="mappingAlert"></div>
    <div class="mapping-list" id="mappingList"></div>

    <div class="preview-section">
      <div class="preview-section-title">
        <i class="fas fa-eye"></i>
        <span>معاينة أول 5 منتجات</span>
      </div>
      <div id="previewAlert"></div>
      <div class="preview-grid" id="previewGrid"></div>
    </div>

    <div class="actions-row">
      <button type="button" class="btn-secondary" id="btnCancel">
        <i class="fas fa-times"></i> إلغاء
      </button>
      <button type="button" class="btn-success" id="btnImport">
        <i class="fas fa-check-circle"></i> تأكيد الاستيراد
      </button>
    </div>

    <div class="import-progress" id="importProgress" style="display:none;">
      <div class="progress-header">
        <span>جاري الاستيراد...</span>
        <span class="percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-detail" id="progressDetail">0 / 0</div>
    </div>
  </div>

  <!-- Step 3: Result -->
  <div class="step-card hidden" id="stepResult">
    <div class="step-title">
      <span class="step-num">3</span>
      <span>النتيجة</span>
    </div>
    <div id="resultContent"></div>
    <div class="actions-row">
      <button type="button" class="btn-secondary" id="btnAnother">
        <i class="fas fa-upload"></i> استيراد ملف آخر
      </button>
      <a href="admin.html" class="btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">
        <i class="fas fa-home"></i> رجوع للوحة
      </a>
    </div>
  </div>

</div>

<div class="toast" id="toastMessage"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- 🌐 نفس نظام الترجمة المستخدم في لوحة الإدارة -->
<script src="i18n.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, get, update, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const $ = id => document.getElementById(id);
const BOOT = window.STORE_BOOTSTRAP;

if (!BOOT || !BOOT.firebaseConfig || String(BOOT.firebaseConfig.apiKey).includes("YOUR_")) {
  alert("config.js manquant ou invalide");
  throw new Error("no config");
}

if (localStorage.getItem('auth') !== 'true') {
  document.body.innerHTML = '<div style="text-align:center; padding:60px; font-family:Cairo,sans-serif; color:#dc2626; font-weight:700;"><h2>يجب تسجيل الدخول أولاً</h2><p style="margin-top:12px; color:#64748b;">سيتم توجيهك تلقائياً...</p></div>';
  setTimeout(() => window.location.href = 'admin.html', 2000);
  throw new Error("not logged in");
}

const app = initializeApp(BOOT.firebaseConfig);
const db = getDatabase(app);

/* ═══════════════════════════════════════════════════════════
   🌐 نصوص الصفحة — تُترجم تلقائياً بواسطة i18n.js
   نضعها هنا لتسهيل الصيانة فقط
   ═══════════════════════════════════════════════════════════ */
const T = {
  ar: {
    step1Title: "رفع ملف Excel",
    uploadTitle: "اضغط هنا لاختيار الملف",
    uploadHint: "أو اسحب الملف وأفلته هنا",
    uploadFormats: "الصيغ المدعومة: .xlsx, .xls, .csv",

/* ═══════════════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════════════ */
function normalize(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/['"`]/g, '')
    .replace(/[^\w\u0600-\u06FF\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function hasAny(hay, needles) {
  return needles.some(n => hay.includes(normalize(n)));
}

function scoreHeaderForType(header, type) {
  const h = normalize(header);
  if (!h) return 0;
  const words = KEYWORDS[type] || [];
  let score = 0;
  words.forEach(w => {
    const nw = normalize(w);
    if (!nw) return;
    if (h === nw) score += 5;
    else if (h.startsWith(nw + ' ') || h.endsWith(' ' + nw)) score += 3;
    else if (h.includes(nw)) score += 1;
  });
  return score;
}

function detectType(header) {
  const h = normalize(header);
  if (!h) return 'ignore';

  if (hasAny(h, ['pa ttc','pa ht','prix achat','prix d achat','prix revient'])) return 'purchasePrice';
  if (hasAny(h, ['prix de vente','prix vente','prix public'])) return 'salePrice';
  if (hasAny(h, ['prix gros','prix de gros','prix en gros'])) return 'wholesalePrice';
  if (hasAny(h, ['qte boite','par boite','pieces par boite','unites par boite','colisage'])) return 'quantityPerBox';

  if (h.includes('سعر') || h.includes('ثمن')) {
    if (h.includes('شراء') || h.includes('تكلفة')) return 'purchasePrice';
    if (h.includes('جملة')) return 'wholesalePrice';
    if (h.includes('بيع')) return 'salePrice';
    return 'salePrice';
  }
  if (h.includes('كمية') || h.includes('عدد')) {
    if (h.includes('علبة') || h.includes('في العلبة')) return 'quantityPerBox';
    if (h.includes('مخزون') || h.includes('المخزون')) return 'quantity';
    return 'quantity';
  }

  let best = 'ignore', bestScore = 0;
  for (const type of Object.keys(KEYWORDS)) {
    const s = scoreHeaderForType(header, type);
    if (s > bestScore) { bestScore = s; best = type; }
  }
  return best;
}

function findHeaderRow(rows) {
  const limit = Math.min(rows.length, 15);
  let bestIdx = -1, bestScore = 0;
  for (let i = 0; i < limit; i++) {
    const row = rows[i] || [];
    let score = 0, nonEmpty = 0;
    row.forEach(cell => {
      const v = String(cell || '').trim();
      if (!v) return;
      nonEmpty++;
      const t = detectType(v);
      if (t !== 'ignore') score += 2;
      if (/prix|سعر|ثمن|code|ref|sku|designation|nom|qte|quantite|كمية|famille|عائلة|image|صورة/i.test(v)) score += 3;
    });
    if (nonEmpty === 0) continue;
    const numericCells = row.filter(c => typeof c === 'number' || /^\d+([.,]\d+)?$/.test(String(c || '').trim())).length;
    score -= numericCells * 1.5;
    if (score > bestScore) { bestScore = score; bestIdx = i; }
  }
  return bestIdx;
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array', cellDates: false, raw: true });
        resolve(wb);
      } catch (err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s) { return escapeHtml(s); }

function parseNumber(v) {
  if (v === undefined || v === null) return 0;
  if (typeof v === 'number') return v;
  const cleaned = String(v).replace(/[^\d.,\-]/g, '').replace(/,/g, '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function fmt(n) { return Number(n || 0).toLocaleString('fr-FR'); }

function showToast(msg) {
  const el = $('toastMessage');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => el.classList.remove('show'), 3000);
}

function renderMapping() {

  list.innerHTML = '';

    const samples = dataRows.slice(0, 3)
      .map(r => r[idx])
      .filter(v => v !== undefined && v !== null && String(v).trim() !== '');
    const sampleText = samples.map(v => String(v).slice(0, 40)).join(' • ');

    const card = document.createElement('div');
    card.className = 'mapping-card';
    card.dataset.colIdx = idx;

    const headerDiv = document.createElement('div');
    headerDiv.className = 'col-header';
    headerDiv.innerHTML = `<div class="col-index">${idx + 1}</div><div class="col-name">${escapeHtml(header || (tt('colPlaceholder') + ' ' + (idx + 1)))}</div>`;
    card.appendChild(headerDiv);

    const field = document.createElement('div');
    field.className = 'mapping-field';
    field.innerHTML = `<span class="mapping-field-label">${tt('typeLabel')}</span>`;

    const select = document.createElement('select');
    select.className = 'type-select ' + (columnTypes[idx] === 'ignore' ? 'ignored' : (columnTypes[idx] === columnDetected[idx] ? 'detected' : 'manual'));
    select.dataset.colIdx = idx;

    COLUMN_TYPES.forEach(tp => {
      const opt = document.createElement('option');
      opt.value = tp.id;
      opt.textContent = tt('type' + tp.id.charAt(0).toUpperCase() + tp.id.slice(1));
      if (tp.id === columnTypes[idx]) opt.selected = true;
      select.appendChild(opt);
    });

    /* ⚡ تحسين الأداء: نعدّل البطاقة فقط بدل إعادة البناء */
    select.addEventListener('change', e => {
      const newType = e.target.value;
      columnTypes[idx] = newType;
      select.className = 'type-select ' + (newType === 'ignore' ? 'ignored' : (newType === columnDetected[idx] ? 'detected' : 'manual'));
      renderPreview();
      updateMappingAlert();
    });

    field.appendChild(select);
    card.appendChild(field);

    const sampleDiv = document.createElement('div');
    sampleDiv.className = 'mapping-sample' + (sampleText ? '' : ' empty');
    sampleDiv.textContent = sampleText || tt('emptySample');
    card.appendChild(sampleDiv);

    list.appendChild(card);
  });
}

async function doImport() {
  const nameIdx = columnTypes.indexOf('name');
  if (nameIdx === -1) { showToast(tt('toastSelectName')); return; }

  const btn = $('btnImport');
  const progress = $('importProgress');
  const progressFill = $('progressFill');
  const progressPercent = $('progressPercent');
  const progressDetail = $('progressDetail');

  btn.disabled = true;
  const origHtml = btn.innerHTML;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ...';
  progress.style.display = 'block';

  try {
    const serialIdx = columnTypes.indexOf('serial');
    const salePriceIdx = columnTypes.indexOf('salePrice');
    const purchasePriceIdx = columnTypes.indexOf('purchasePrice');
    const wholesalePriceIdx = columnTypes.indexOf('wholesalePrice');
    const quantityIdx = columnTypes.indexOf('quantity');
    const qtyPerBoxIdx = columnTypes.indexOf('quantityPerBox');
    const familyIdx = columnTypes.indexOf('family');
    const imageIdx = columnTypes.indexOf('image');
    const descIdx = columnTypes.indexOf('description');

    /* 1. قراءة المنتجات الموجودة */
    const snap = await get(ref(db, 'products'));
    const currentProducts = snap.val() || {};

    const existingSerials = new Set();
    const existingNames = new Set();
    Object.values(currentProducts).forEach(p => {
      if (p.serial) existingSerials.add(String(p.serial).trim().toLowerCase());
      if (p.name) existingNames.add(normalize(p.name));
    });

    /* 2. بناء قائمة المنتجات الجديدة */
    const newProducts = [];
    const newSerials = new Set();
    const newNames = new Set();

    let skippedExisting = 0;
    let skippedDuplicateInFile = 0;
    let skippedNoName = 0;

    for (const row of dataRows) {
      const name = String(row[nameIdx] || '').trim();
      if (!name) { skippedNoName++; continue; }

      const serial = serialIdx !== -1 ? String(row[serialIdx] || '').trim() : '';
      const nameNorm = normalize(name);
      const serialNorm = serial ? serial.toLowerCase() : '';

      const isDupInFile =
        (serialNorm && newSerials.has(serialNorm)) ||
        (!serialNorm && newNames.has(nameNorm)) ||
        (serialNorm && newNames.has(nameNorm));

      if (isDupInFile) { skippedDuplicateInFile++; continue; }

      const isExisting =
        (serialNorm && existingSerials.has(serialNorm)) ||
        (!serialNorm && existingNames.has(nameNorm)) ||
        (serialNorm && existingNames.has(nameNorm));

      if (isExisting) { skippedExisting++; continue; }

      const salePrice = salePriceIdx !== -1 ? parseNumber(row[salePriceIdx]) : 0;
      const purchasePrice = purchasePriceIdx !== -1 ? parseNumber(row[purchasePriceIdx]) : null;
      const wholesalePrice = wholesalePriceIdx !== -1 ? parseNumber(row[wholesalePriceIdx]) : null;
      const quantity = quantityIdx !== -1 ? (parseInt(row[quantityIdx]) || 0) : null;
      const qtyPerBox = qtyPerBoxIdx !== -1 ? (parseInt(row[qtyPerBoxIdx]) || 0) : null;
      const family = familyIdx !== -1 ? String(row[familyIdx] || '').trim() : '';
      let imageUrl = imageIdx !== -1 ? String(row[imageIdx] || '').trim() : '';
      if (imageUrl && !/^https?:\/\//i.test(imageUrl)) imageUrl = '';
      const description = descIdx !== -1 ? String(row[descIdx] || '').trim() : '';

      const productData = {
        name,
        price: salePrice > 0 ? salePrice : 0,
        serial: serial || null,
        wholesalePrice: wholesalePrice && wholesalePrice > 0 ? wholesalePrice : null,
        quantityPerBox: qtyPerBox && qtyPerBox > 0 ? qtyPerBox : null,
        family: family || '',
        imageUrl: imageUrl || '',
        hidden: false,
        createdAt: Date.now()
      };
      if (purchasePrice !== null && !isNaN(purchasePrice)) productData.costPrice = purchasePrice;
      if (quantity !== null && !isNaN(quantity)) {
        productData.stockQuantity = quantity;
        productData.trackStock = true;
      }
      if (description) productData.description = description;

      newProducts.push({ data: productData, name, serialNorm, nameNorm });
      if (serialNorm) newSerials.add(serialNorm);
      newNames.add(nameNorm);
    }

    /* 3. الكتابة على دفعات */
    const totalBatches = Math.ceil(newProducts.length / BATCH_SIZE);
    let addedCount = 0;
    const addedNames = [];

    for (let b = 0; b < totalBatches; b++) {
      const batch = newProducts.slice(b * BATCH_SIZE, (b + 1) * BATCH_SIZE);
      const updates = {};
      for (const item of batch) {
        const newRef = push(ref(db, 'products'));
        updates['products/' + newRef.key] = item.data;
      }
      await update(ref(db), updates);
      addedCount += batch.length;
      batch.forEach(it => addedNames.push(it.name));

      const pct = Math.round(((b + 1) / totalBatches) * 100);
      progressFill.style.width = pct + '%';
      progressPercent.textContent = pct + '%';
      progressDetail.textContent = tt('progressDetail', { done: b + 1, total: totalBatches });
    }

    if (totalBatches === 0) {
      progressFill.style.width = '100%';
      progressPercent.textContent = '100%';
    }

    /* 4. عرض النتيجة */
    renderResult({
      added: addedCount,
      skippedExisting,
      skippedDuplicateInFile,
      skippedNoName,
      addedNames
    });

    $('stepMapping').classList.add('hidden');
    $('stepResult').classList.remove('hidden');
    showToast(tt('toastAllDone'));

  } catch (err) {
    console.error(err);
    showToast(tt('toastImportError') + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = origHtml;
  }
}

function renderResult(stats) {
  const addedNames = stats.addedNames || [];
  $('resultContent').innerHTML = `
    <div class="alert-box alert-success">
      <i class="fas fa-check-circle"></i>
      <div><b>${tt('importSuccess')}</b></div>
    </div>

    <div class="result-stats">
      <div class="result-stat success">
        <div class="val">${stats.added}</div>
        <div class="lbl">${tt('statAdded')}</div>
      </div>
      <div class="result-stat info">
        <div class="val">${stats.skippedExisting}</div>
        <div class="lbl">${tt('statExisting')}</div>
      </div>
      <div class="result-stat warning">
        <div class="val">${stats.skippedDuplicateInFile}</div>
        <div class="lbl">${tt('statDuplicate')}</div>
      </div>
      <div class="result-stat muted">
        <div class="val">${stats.skippedNoName}</div>
        <div class="lbl">${tt('statNoName')}</div>
      </div>
    </div>

    ${addedNames.length > 0 ? `
    <div class="added-list-box">
      <div class="added-list-title">
        <i class="fas fa-list"></i>
        ${tt('addedListTitle')} (${addedNames.length})
      </div>
      <div class="added-list-content">
        ${addedNames.map((n, i) => `<div class="item"><b>${i + 1}.</b> ${escapeHtml(n)}</div>`).join('')}
      </div>
    </div>` : ''}
  `;
}

/* ═══════════════════════════════════════════════════════════
   File Handling
   ═══════════════════════════════════════════════════════════ */
async function handleFile(file) {
  if (!file) return;
  $('fileName').textContent = file.name;
  $('fileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';

  try {
    workbook = await readFile(file);
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true });

    if (!rows.length) { showToast(tt('toastFileEmpty')); return; }

    headerRowIndex = findHeaderRow(rows);
    if (headerRowIndex === -1) headerRowIndex = 0;

    rawHeaders = (rows[headerRowIndex] || []).map(h => String(h || '').trim());
    dataRows = rows.slice(headerRowIndex + 1).filter(r => r && r.some(c => String(c || '').trim() !== ''));

    let lastNonEmpty = -1;
    rawHeaders.forEach((h, i) => { if (h) lastNonEmpty = i; });
    if (lastNonEmpty === -1) lastNonEmpty = rawHeaders.length - 1;
    rawHeaders = rawHeaders.slice(0, lastNonEmpty + 1);
    dataRows = dataRows.map(r => r.slice(0, lastNonEmpty + 1));

    columnTypes = rawHeaders.map(h => detectType(h));
    columnDetected = [...columnTypes];

    const nameSeen = new Set();
    columnTypes = columnTypes.map(tp => {
      if (tp === 'name') {
        if (nameSeen.has('name')) return 'ignore';
        nameSeen.add('name');
      }
      return tp;
    });

    renderMapping();
    renderPreview();
    updateMappingAlert();

    $('stepUpload').classList.add('hidden');
    $('stepMapping').classList.remove('hidden');

  } catch (err) {
    console.error(err);
    showToast(tt('toastReadError') + err.message);
  }
}

/* ═══════════════════════════════════════════════════════════
   Events
   ═══════════════════════════════════════════════════════════ */
$('uploadZone').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
  e.target.value = '';
});

['dragover','dragenter'].forEach(ev => {
  $('uploadZone').addEventListener(ev, e => {
    e.preventDefault();
    $('uploadZone').classList.add('drag-over');
  });
});
['dragleave','drop'].forEach(ev => {
  $('uploadZone').addEventListener(ev, e => {
    e.preventDefault();
    $('uploadZone').classList.remove('drag-over');
  });
});
$('uploadZone').addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

$('btnReset').addEventListener('click', () => {
  workbook = null; headerRowIndex = -1; rawHeaders = []; dataRows = [];
  columnTypes = []; columnDetected = [];
  $('importProgress').style.display = 'none';
  $('progressFill').style.width = '0%';
  $('stepMapping').classList.add('hidden');
  $('stepUpload').classList.remove('hidden');
  $('fileInput').value = '';
});

$('btnCancel').addEventListener('click', () => {
  if (confirm(LANG === 'fr' ? 'Annuler l\'import et revenir ?' : 'إلغاء الاستيراد والعودة؟')) {
    window.location.href = 'admin.html';
  }
});

$('btnImport').addEventListener('click', doImport);

$('btnAnother').addEventListener('click', () => {
  $('stepResult').classList.add('hidden');
  $('stepUpload').classList.remove('hidden');
  $('btnReset').click();
});

/* تحديث أيقونة الرجوع حسب اللغة */
if (LANG === 'fr') {
  $('backIcon').className = 'fas fa-arrow-left';
}

loadStoreInfo();
</script>
