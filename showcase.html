<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary-50:#ecfdf5;--primary-100:#d1fae5;--primary-200:#a7f3d0;--primary-400:#34d399;
  --primary:#008060;--primary-600:#006b50;--primary-hover:#004c3f;
  --primary-tint:#f1f8f5;--primary-soft:rgba(0,128,96,.10);--primary-ring:rgba(0,128,96,.18);
  --success:#10b981;--success-tint:#ecfdf5;
  --danger:#dc2626;--danger-tint:#fef2f2;
  --warning:#d97706;--warning-tint:#fffbeb;
  --info:#2563eb;--info-tint:#eff6ff;
  --vip:#7c3aed;--vip-tint:#f5f3ff;--gold:#d4a745;
  --bg:#f7f8fa;--bg-2:#f1f3f5;--card:#ffffff;
  --text:#0f172a;--text-2:#475569;--text-3:#64748b;--muted:#94a3b8;
  --border:#e5e8ec;--border-2:#eef1f4;--border-strong:#d5dae0;--hover:#f3f5f8;
  --radius-xs:6px;--radius-sm:8px;--radius:10px;--radius-md:12px;--radius-lg:14px;--radius-xl:18px;--radius-full:9999px;
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);
  --shadow-md:0 2px 4px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06);
  --shadow-lg:0 8px 24px rgba(15,23,42,.08),0 2px 6px rgba(15,23,42,.04);
  --shadow-xl:0 24px 48px rgba(15,23,42,.12);
  --shadow-focus:0 0 0 3px var(--primary-ring);
  --ease:cubic-bezier(.22,1,.36,1);--dur-fast:120ms;--dur:180ms;--dur-slow:260ms;
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html,body{background:var(--bg);overflow-x:hidden;max-width:100vw}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body[dir="rtl"]{direction:rtl;text-align:right}
body[dir="ltr"]{direction:ltr;text-align:left}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}
::selection{background:var(--primary-100);color:var(--primary-hover)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:var(--radius-full);border:2px solid var(--bg)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

#loadingScreen,#noticeScreen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);color:var(--primary);font-weight:700}
#noticeScreen{display:none;color:var(--muted);text-align:center;padding:40px}
#noticeScreen .ico{font-size:56px;color:var(--primary-200);margin-bottom:16px}
#loadingScreen .spinner{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.header{position:sticky;top:0;z-index:1100;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border);transition:transform .3s var(--ease)}
.header.hidden{transform:translateY(-110%)}
.header-inner{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800;font-size:1.05rem;color:var(--text)}
.brand-logo{height:38px;width:auto;max-width:52px;object-fit:contain;border-radius:var(--radius-sm);border:1px solid var(--border);flex-shrink:0}
.brand-logo-fb{width:38px;height:38px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--primary-600));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.tools{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:var(--radius-sm);background:#fff;border:1px solid var(--border);color:var(--text-2);font-size:14px;display:inline-flex;align-items:center;justify-content:center;position:relative;transition:all var(--dur) var(--ease)}
.icon-btn:hover{background:var(--hover);border-color:var(--border-strong);color:var(--text)}
.icon-btn.cart{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px var(--primary-soft)}
.icon-btn.cart:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.icon-btn .badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 5px;background:var(--danger);color:#fff;border:2px solid #fff;border-radius:var(--radius-full);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.icon-btn.cart .badge{background:#fff;color:var(--primary)}
@media(max-width:600px){.header-inner{padding:10px 12px}.brand{font-size:.92rem}.brand-logo,.brand-logo-fb{height:34px;width:34px}.icon-btn{width:34px;height:34px;font-size:13px}}

.announcement{background:linear-gradient(135deg,var(--primary),var(--primary-600));color:#fff;font-size:.78rem;font-weight:600;padding:10px 0;overflow:hidden;position:relative;white-space:nowrap;display:none}
.announcement.show{display:block}
.marquee-track{display:inline-flex;white-space:nowrap;animation:marquee 30s linear infinite}
body[dir="ltr"] .marquee-track{animation-name:marquee-ltr}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(50%)}}
@keyframes marquee-ltr{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.marquee-text{display:inline-block;padding:0 1.5rem}

.search-overlay{display:none;background:#fff;border-bottom:1px solid var(--border)}
.search-overlay.show{display:block}
.search-inner{max-width:1400px;margin:0 auto;padding:14px 20px;position:relative}
.search-input{width:100%;padding:12px 44px 12px 18px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--bg);font-size:.92rem;outline:none;transition:all var(--dur) var(--ease)}
.search-input:focus{border-color:var(--primary);box-shadow:var(--shadow-focus);background:#fff}
.search-inner .s-ico{position:absolute;top:50%;inset-inline-end:36px;transform:translateY(-50%);color:var(--text-3);font-size:14px;pointer-events:none}

.hero-shell{max-width:1400px;margin:0 auto;padding:16px 20px 8px}
.hero-shell.hidden{display:none}
.hero-stage{position:relative;width:100%;border-radius:var(--radius-xl);overflow:hidden;background:var(--bg-2);box-shadow:var(--shadow-lg);aspect-ratio:16/8;user-select:none;isolation:isolate;border:1px solid var(--border);touch-action:pan-y}
@media(max-width:900px){.hero-shell{padding:12px 14px 6px}.hero-stage{aspect-ratio:16/11}}
@media(max-width:520px){.hero-stage{aspect-ratio:4/3}}
.hero-slides{position:absolute;inset:0}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 900ms var(--ease);transform:scale(1.04);will-change:opacity,transform;pointer-events:none}
.hero-slide.active{opacity:1;transform:scale(1);pointer-events:auto;z-index:2}
.hero-slide img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(180deg,transparent 0%,transparent 42%,rgba(15,23,42,.35) 72%,rgba(15,23,42,.82) 100%);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:clamp(20px,4vw,44px);text-align:center}
.hero-info{width:100%;max-width:620px;color:#fff;pointer-events:auto;transition:opacity 400ms var(--ease);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto}
.hero-info.fading{opacity:0}
.hero-name{width:100%;font-size:clamp(1.4rem,3.2vw,2.4rem);font-weight:900;line-height:1.15;letter-spacing:-.02em;margin-bottom:10px;text-shadow:0 2px 24px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center;margin-inline:auto}
.hero-meta{width:100%;display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;text-align:center}
.hero-price{display:inline-flex;align-items:baseline;gap:4px;font-size:clamp(1.3rem,2.4vw,1.9rem);font-weight:900;letter-spacing:-.02em;line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.35);white-space:nowrap}
.hero-price .cur{font-size:.55em;font-weight:700;opacity:.9;white-space:nowrap}
.hero-price-old{font-size:.9rem;color:rgba(255,255,255,.65);text-decoration:line-through}
.hero-cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 24px;background:#fff;color:var(--primary-hover);border-radius:var(--radius-full);font-weight:800;font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:all var(--dur) var(--ease);margin-inline:auto}
.hero-cta:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.28)}
.hero-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:0;pointer-events:none;transition:all var(--dur) var(--ease)}
.hero-stage:hover .hero-nav{opacity:1;pointer-events:auto}
.hero-nav:hover{background:#fff;color:var(--primary)}
.hero-nav.prev{inset-inline-end:20px}
.hero-nav.next{inset-inline-start:20px}
.hero-dots{position:absolute;bottom:16px;inset-inline-start:50%;transform:translateX(-50%);z-index:6;display:flex;gap:6px;padding:7px 13px;background:rgba(15,23,42,.35);backdrop-filter:blur(10px);border-radius:var(--radius-full)}
.hero-dots .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:all 300ms var(--ease);cursor:pointer;border:none;padding:0}
.hero-dots .dot.on{background:#fff;width:22px;border-radius:4px}

.sc-hero-text{max-width:900px;margin:0 auto;padding:16px 20px 12px;text-align:center}
.sc-hero-text h1{font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:900;letter-spacing:-.03em;line-height:1.2;margin-bottom:8px;color:var(--text)}
.sc-hero-text .sub1{font-size:clamp(.88rem,1.4vw,1rem);font-weight:600;color:var(--text-2);line-height:1.6;margin-bottom:6px}
.sc-hero-text .sub2{font-size:.84rem;font-weight:600;color:var(--primary);padding:6px 16px;background:var(--primary-tint);border-radius:var(--radius-full);display:inline-block;margin-top:6px}
@media(max-width:640px){.sc-hero-text{padding:12px 16px 8px}.sc-hero-text h1{margin-bottom:6px}.sc-hero-text .sub1{font-size:.85rem}}

.sec-head{max-width:1400px;margin:0 auto;padding:18px 20px 10px;display:flex;align-items:center;justify-content:center;gap:18px}
.sec-tools{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;width:100%}
.sec-counter{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-full);font-size:.78rem;font-weight:700;color:var(--text-2);white-space:nowrap;box-shadow:var(--shadow-xs)}
.sec-counter b{color:var(--text);font-weight:900;font-size:.88rem}
.sec-counter i{color:var(--primary);font-size:.76rem}
.sort-wrap{position:relative}
.sort-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-full);font-size:.78rem;font-weight:700;color:var(--text-2);transition:all var(--dur) var(--ease);box-shadow:var(--shadow-xs)}
.sort-btn:hover{border-color:var(--border-strong);color:var(--text)}
.sort-btn i:first-child{font-size:.76rem;color:var(--primary)}
.sort-menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;min-width:200px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:5px;display:none;z-index:100}
.sort-menu.show{display:block}
.sort-opt{width:100%;text-align:inherit;padding:9px 12px;border-radius:var(--radius-sm);font-size:.82rem;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px;transition:all var(--dur-fast) var(--ease);cursor:pointer;background:transparent;border:none;font-family:var(--font)}
.sort-opt:hover{background:var(--hover);color:var(--text)}
.sort-opt.on{background:var(--primary-tint);color:var(--primary-hover);font-weight:800}
.sort-opt i{width:14px;font-size:.72rem;opacity:0}
.sort-opt.on i{opacity:1}
@media(max-width:680px){.sec-head{padding:14px 16px 8px;gap:14px}.sec-counter,.sort-btn{padding:8px 14px;font-size:.74rem}}

.fam-bar{max-width:1400px;margin:0 auto;padding:8px 20px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;position:relative;z-index:1100}
.fam-bar::-webkit-scrollbar{display:none}
.fam-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-full);background:#fff;border:1px solid var(--border);font-size:.76rem;font-weight:700;color:var(--text-2);white-space:nowrap;transition:all var(--dur) var(--ease);cursor:pointer}
.fam-chip:hover{border-color:var(--border-strong);color:var(--text)}
.fam-chip.active{background:var(--text);border-color:var(--text);color:#fff}
.fam-chip .n{min-width:18px;padding:1px 6px;border-radius:var(--radius-full);background:rgba(15,23,42,.06);font-size:.62rem;font-weight:800;text-align:center;line-height:1.6;color:inherit}
.fam-chip.active .n{background:rgba(255,255,255,.22);color:#fff}
.fam-chip.c-new{color:var(--info);border-color:#bfdbfe}.fam-chip.c-new.active{background:var(--info);border-color:var(--info);color:#fff}
.fam-chip.c-sale{color:var(--danger);border-color:#fecaca}.fam-chip.c-sale.active{background:var(--danger);border-color:var(--danger);color:#fff}
.fam-chip.c-fav{color:var(--primary);border-color:var(--primary-200)}.fam-chip.c-fav.active{background:var(--primary);border-color:var(--primary);color:#fff}
.fam-chip.c-clear{background:var(--danger-tint);color:var(--danger);border-color:#fecaca}
.fam-chip.fam-toggle{color:var(--primary);border-color:var(--primary-200);position:relative;z-index:1101}
.fam-chip.fam-toggle.open,.fam-chip.fam-toggle.active{background:var(--primary);border-color:var(--primary);color:#fff}
.fam-chip.fam-toggle .chev{font-size:.62rem;opacity:.75;transition:transform .2s var(--ease)}
.fam-chip.fam-toggle.open .chev{transform:rotate(180deg)}
.fam-panel{position:fixed;z-index:1300;min-width:240px;max-width:340px;max-height:340px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:6px;display:none;overflow:hidden;flex-direction:column}
.fam-panel.show{display:flex}
.fam-panel-search{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg-2);border-radius:var(--radius-sm);margin-bottom:4px}
.fam-panel-search i{color:var(--text-3);font-size:12px}
.fam-panel-search input{flex:1;border:none;background:transparent;outline:none;font-size:.84rem;color:var(--text);font-family:var(--font)}
.fam-panel-list{overflow-y:auto;flex:1;max-height:280px}
.fam-panel-item{width:100%;text-align:inherit;padding:9px 12px;border-radius:var(--radius-sm);font-size:.84rem;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px;transition:all var(--dur-fast) var(--ease);cursor:pointer;background:transparent;border:none;font-family:var(--font)}
.fam-panel-item:hover{background:var(--hover);color:var(--text)}
.fam-panel-item.active{background:var(--primary);color:#fff}
.fam-panel-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.fam-panel-item .nm i{font-size:.72rem;opacity:.7}
.fam-panel-item .ct{padding:2px 8px;border-radius:var(--radius-full);background:rgba(15,23,42,.06);color:var(--text-2);font-size:.66rem;font-weight:800;flex-shrink:0}
.fam-panel-item.active .ct{background:rgba(255,255,255,.22);color:#fff}
.fam-panel-empty{padding:24px 14px;text-align:center;font-size:.8rem;color:var(--text-3)}
@media(max-width:680px){.fam-bar{padding:6px 12px 0;gap:5px}.fam-chip{padding:7px 11px;font-size:.7rem}.fam-chip .n{min-width:16px;padding:1px 5px;font-size:.6rem}}

.catalog{max-width:1400px;margin:0 auto;padding:14px 20px 40px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:340px;gap:16px;grid-auto-flow:dense}
@media(max-width:1100px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:320px;gap:14px}}
@media(max-width:780px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:300px;gap:12px}}
@media(max-width:480px){.pgrid{grid-auto-rows:280px;gap:10px}}
.pc{position:relative;display:block;background:var(--bg-2);border-radius:var(--radius-lg);overflow:hidden;min-width:0;height:100%;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);cursor:pointer;isolation:isolate;box-shadow:var(--shadow-sm)}
.pc:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.pc-media{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.pc-media img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transition:transform .6s var(--ease);pointer-events:none}
.pc:hover .pc-media img{transform:scale(1.06)}
.pc-media .no-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--border-strong);font-size:2.4rem;background:var(--bg-2)}
.pc-media-link{position:absolute;inset:0;z-index:2}
.pc-overlay{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;gap:6px;color:#fff}(180deg, transparent 0%, rgba(15,23,42,.30) 35%, rgba(15,23,42,.72) 75%, rgba(15,23,42,.90) 100%);padding:26px 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;color:#fff;pointer-events:none}
.pc-badge{position:absolute;top:10px;inset-inline-start:10px;z-index:5;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-full);color:#fff;font-size:10px;font-weight:800;letter-spacing:.02em;line-height:1.4;box-shadow:0 3px 10px rgba(15,23,42,.28);pointer-events:none;white-space:nowrap}
.pc-badge i{font-size:9px}
.pc-badge.b-new{background:var(--success)}

/* ═══════════════════════════════════════════════════════════
   🌙 الوضع الداكن — شامل لـ showcase.html
   ═══════════════════════════════════════════════════════════ */
body.admin-dark {
  --bg: #0f172a;
  --bg-2: #1e293b;
  --card: #1e293b;
  --text: #f1f5f9;
  --text-2: #cbd5e1;
  --text-3: #94a3b8;
  --muted: #64748b;
  --border: #334155;
  --border-2: #293548;
  --border-strong: #475569;
  --hover: #334155;
  --primary-50: #132b24;
  --primary-100: #164e3e;
  --primary-200: #34d399;
  --primary-tint: rgba(0, 128, 96, .18);
  --primary-soft: rgba(0, 128, 96, .25);
  --success-tint: rgba(16, 185, 129, .15);
  --danger-tint: rgba(220, 38, 38, .15);
  --warning-tint: rgba(217, 119, 6, .15);
  --info-tint: rgba(37, 99, 235, .15);
  --vip-tint: rgba(124, 58, 237, .15);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .4);
  --shadow-md: 0 2px 6px rgba(0, 0, 0, .4);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, .5);
  --shadow-xl: 0 24px 48px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
body.admin-dark, body.admin-dark #app { background: var(--bg); color: var(--text); }

/* ═══ Header ═══ */
body.admin-dark .header { background: rgba(15, 23, 42, .92); border-color: var(--border); }
body.admin-dark .brand { color: var(--text); }
body.admin-dark .brand-logo { border-color: var(--border); }
body.admin-dark .icon-btn { background: var(--card); color: var(--text-2); border-color: var(--border); }
body.admin-dark .icon-btn:hover { background: var(--hover); color: var(--text); border-color: var(--border-strong); }
body.admin-dark .icon-btn.cart { background: var(--primary); color: #fff; border-color: var(--primary); }
body.admin-dark .icon-btn.cart:hover { background: var(--primary-hover); }
body.admin-dark .icon-btn .badge { background: #dc2626; border-color: var(--card); }
body.admin-dark .icon-btn.cart .badge { background: #fff; color: var(--primary); }
body.admin-dark .search-overlay { background: var(--card); border-color: var(--border); }
body.admin-dark .search-input { background: var(--bg-2); color: var(--text); border-color: var(--border); }
body.admin-dark .search-input:focus { background: var(--card); border-color: var(--primary); }

/* ═══ زر الليل/النهار ═══ */
.theme-toggle-btn { position: relative; }
body.admin-dark #themeToggleIcon { color: #fbbf24; }

/* ═══ Announcement ═══ */
body.admin-dark .announcement { background: linear-gradient(135deg, #064e3b, #0b6e4f); }

/* ═══ Hero ═══ */
body.admin-dark .hero-stage { background: var(--bg-2); border-color: var(--border); }
body.admin-dark .hero-nav { background: rgba(30, 41, 59, .6); border-color: rgba(255, 255, 255, .15); }
body.admin-dark .hero-nav:hover { background: var(--card); color: var(--primary-200); }
body.admin-dark .hero-dots { background: rgba(0, 0, 0, .5); }

/* ═══ Showcase Text ═══ */
body.admin-dark .sc-hero-text h1 { color: var(--text); }
body.admin-dark .sc-hero-text .sub1 { color: var(--text-2); }
body.admin-dark .sc-hero-text .sub2 { background: var(--primary-tint); color: var(--primary-200); }

/* ═══ Section Head (Counter + Sort) ═══ */
body.admin-dark .sec-counter { background: var(--card); border-color: var(--border); color: var(--text-2); }
body.admin-dark .sec-counter b { color: var(--text); }
body.admin-dark .sec-counter i { color: var(--primary-200); }
body.admin-dark .sort-btn { background: var(--card); border-color: var(--border); color: var(--text-2); }
body.admin-dark .sort-btn:hover { border-color: var(--border-strong); color: var(--text); }
body.admin-dark .sort-menu { background: var(--card); border-color: var(--border); }
body.admin-dark .sort-opt { color: var(--text-2); }
body.admin-dark .sort-opt:hover { background: var(--hover); color: var(--text); }
body.admin-dark .sort-opt.on { background: var(--primary-tint); color: var(--primary-200); }

/* ═══ Family Bar ═══ */
body.admin-dark .fam-chip { background: var(--card); border-color: var(--border); color: var(--text-2); }
body.admin-dark .fam-chip:hover { border-color: var(--border-strong); color: var(--text); }
body.admin-dark .fam-chip.active { background: var(--text); border-color: var(--text); color: var(--bg); }
body.admin-dark .fam-chip .n { background: rgba(255, 255, 255, .08); color: inherit; }
body.admin-dark .fam-chip.c-new { color: #60a5fa; border-color: #1e40af; }
body.admin-dark .fam-chip.c-new.active { background: #2563eb; border-color: #2563eb; color: #fff; }
body.admin-dark .fam-chip.c-sale { color: #f87171; border-color: #7f1d1d; }
body.admin-dark .fam-chip.c-sale.active { background: #dc2626; border-color: #dc2626; color: #fff; }
body.admin-dark .fam-chip.c-fav { color: var(--primary-200); border-color: var(--primary-200); }
body.admin-dark .fam-chip.c-fav.active { background: var(--primary); border-color: var(--primary); color: #fff; }
body.admin-dark .fam-chip.c-clear { background: var(--danger-tint); color: #f87171; border-color: #7f1d1d; }
body.admin-dark .fam-chip.fam-toggle { color: var(--primary-200); border-color: var(--primary-200); }
body.admin-dark .fam-chip.fam-toggle.open,
body.admin-dark .fam-chip.fam-toggle.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ═══ Family Panel ═══ */
body.admin-dark .fam-panel { background: var(--card); border-color: var(--border); }
body.admin-dark .fam-panel-search { background: var(--bg-2); }
body.admin-dark .fam-panel-search input { color: var(--text); }
body.admin-dark .fam-panel-search input::placeholder { color: var(--text-3); }
body.admin-dark .fam-panel-item { color: var(--text-2); }
body.admin-dark .fam-panel-item:hover { background: var(--hover); color: var(--text); }
body.admin-dark .fam-panel-item.active { background: var(--primary); color: #fff; }
body.admin-dark .fam-panel-item .ct { background: rgba(255, 255, 255, .08); }
body.admin-dark .fam-panel-item.active .ct { background: rgba(255, 255, 255, .22); color: #fff; }
body.admin-dark .fam-panel-empty { color: var(--text-3); }

/* ═══ Product Cards ═══ */
body.admin-dark .pc { background: var(--bg-2); box-shadow: 0 4px 12px rgba(0, 0, 0, .4); }
body.admin-dark .pc:hover { box-shadow: 0 12px 32px rgba(0, 0, 0, .5); }
body.admin-dark .pc-media .no-img { background: var(--bg-2); color: var(--border-strong); }
body.admin-dark .pc-fav { background: rgba(30, 41, 59, .95); color: var(--text-2); }
body.admin-dark .pc-fav:hover { background: #dc2626; color: #fff; }
body.admin-dark .pc-fav.on { background: #dc2626; color: #fff; }
body.admin-dark .pc-add { background: var(--primary); }
body.admin-dark .pc-add:hover { background: var(--primary-hover); }

/* ═══ Pager ═══ */
body.admin-dark .pager button { background: var(--card); color: var(--text-2); border-color: var(--border); }
body.admin-dark .pager button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
body.admin-dark .pager button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
body.admin-dark .pager .sep { color: var(--text-3); }

/* ═══ Empty State ═══ */
body.admin-dark .empty .ic { background: var(--card); border-color: var(--border); }
body.admin-dark .empty h3 { color: var(--text); }
body.admin-dark .empty p { color: var(--text-2); }

/* ═══ Cart Drawer ═══ */
body.admin-dark .drawer { background: var(--card); box-shadow: -20px 0 60px rgba(0, 0, 0, .4); }
body.admin-dark .drawer-head { border-color: var(--border); }
body.admin-dark .drawer-title { color: var(--text); }
body.admin-dark .drawer-title .cnt { background: var(--primary-tint); color: var(--primary-200); }
body.admin-dark .drawer-close { background: var(--bg-2); color: var(--text-2); }
body.admin-dark .drawer-close:hover { background: #dc2626; color: #fff; }
body.admin-dark .cart-row { border-color: var(--border); }
body.admin-dark .cart-thumb { background: var(--bg-2); border-color: var(--border); }
body.admin-dark .cart-name { color: var(--text); }
body.admin-dark .cart-line .lbl { color: var(--text-3); }
body.admin-dark .cart-line .vl { color: var(--text); }
body.admin-dark .cart-line.total-line .vl { color: var(--primary-200); }
body.admin-dark .qty-btn { background: var(--bg-2); border-color: var(--border); color: var(--text); }
body.admin-dark .qty-btn:hover:not(:disabled) { background: var(--primary); border-color: var(--primary); }
body.admin-dark .qty-val { color: var(--text); }
body.admin-dark .cart-remove { color: var(--text-3); }
body.admin-dark .cart-remove:hover { background: var(--danger-tint); color: #f87171; }
body.admin-dark .cart-empty { color: var(--text-3); }
body.admin-dark .cart-empty i { color: var(--border-strong); }
body.admin-dark .cart-empty h4 { color: var(--text); }
body.admin-dark .drawer-foot { background: var(--bg); border-color: var(--border); }
body.admin-dark .cart-tot { color: var(--text); }
body.admin-dark .cart-tot b { color: var(--primary-200); }
body.admin-dark .btn-checkout { background: var(--primary); }

/* ═══ FAB Cart ═══ */
body.admin-dark .fab-cart { background: var(--primary); box-shadow: 0 8px 24px rgba(0, 128, 96, .5); }
body.admin-dark .fab-cart:hover { background: var(--primary-hover); }

/* ═══ Modals / Masks ═══ */
body.admin-dark .mask { background: rgba(0, 0, 0, .7); }
body.admin-dark .dialog { background: var(--card); border-color: var(--border); box-shadow: 0 24px 48px rgba(0, 0, 0, .5); }
body.admin-dark .dialog h3 { color: var(--text); border-color: var(--border); }
body.admin-dark .dialog .close-x { background: var(--bg-2); color: var(--text-2); }
body.admin-dark .dialog .close-x:hover { background: #dc2626; color: #fff; }
body.admin-dark .field-label { color: var(--text-2); }
body.admin-dark .field-input { background: var(--bg-2); color: var(--text); border-color: var(--border); }
body.admin-dark .field-input:focus { background: var(--card); border-color: var(--primary); }
body.admin-dark .field-input::placeholder { color: var(--text-3); }
body.admin-dark .delivery-opt { background: var(--bg-2); border-color: var(--border); color: var(--text-2); }
body.admin-dark .delivery-opt:hover { border-color: var(--primary-200); }
body.admin-dark .delivery-opt.active { background: var(--primary-tint); border-color: var(--primary); color: var(--primary-200); }
body.admin-dark .order-summary { background: var(--bg); border-color: var(--border); }
body.admin-dark .os-row { color: var(--text-2); }
body.admin-dark .os-row .nm { color: var(--text); }
body.admin-dark .os-row .pr { color: var(--primary-200); }
body.admin-dark .checkout-summary { background: var(--primary-tint); border-color: var(--primary-200); }
body.admin-dark .cs-row { color: var(--text-2); }
body.admin-dark .cs-row + .cs-row { border-color: rgba(255, 255, 255, .1); }
body.admin-dark .cs-row .val { color: var(--text); }
body.admin-dark .cs-row.cs-total { border-color: var(--primary-200); }
body.admin-dark .cs-row.cs-total span:first-child { color: var(--primary-200); }
body.admin-dark .cs-row.cs-total .val { color: var(--primary-200); }
body.admin-dark .dialog .hint { color: var(--text-3); }
body.admin-dark #viewer .dialog { background: transparent; }

/* ═══ Success Modal ═══ */
body.admin-dark .success-modal .dialog { background: var(--card); }
body.admin-dark .success-modal .success-icon { background: linear-gradient(135deg, var(--primary-tint), var(--primary-50)); }
body.admin-dark .success-modal h2 { color: var(--primary-200); }
body.admin-dark .success-modal .thank-msg { color: var(--text-2); }
body.admin-dark .success-modal .thank-msg strong { color: var(--primary-200); }
body.admin-dark .success-modal .btn-modal-close { background: linear-gradient(135deg, var(--primary), var(--primary-600)); }

/* ═══ Toast ═══ */
body.admin-dark .toast { background: #f1f5f9; color: #0f172a; }
body.admin-dark .toast.success { background: #10b981; color: #fff; }
body.admin-dark .toast.error { background: #dc2626; color: #fff; }

/* ═══ Footer ═══ */
body.admin-dark .footer { background: var(--card); border-color: var(--border); }
body.admin-dark .footer-brand { color: var(--text); }
body.admin-dark .footer-action-btn,
body.admin-dark .footer-socials a { background: var(--bg-2); color: var(--primary-200); border-color: var(--border); }
body.admin-dark .footer-action-btn:hover,
body.admin-dark .footer-socials a:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
body.admin-dark .footer-phone { background: var(--bg); border-color: var(--border); color: var(--text-2); }
body.admin-dark .footer-phone a { color: var(--primary-200); }
body.admin-dark .footer-copy { color: var(--text-3); }

/* ═══ Scrollbar ═══ */
body.admin-dark ::-webkit-scrollbar-thumb { background: #475569; border-color: var(--bg); }
</style>
</head>

<script>
  (function() {
    'use strict';
    const KEY = 'admin_theme';
    
    function applyTheme(theme) {
      const body = document.body;
      if (!body) return;
      const icon = document.getElementById('themeToggleIcon');
      if (theme === 'dark') {
        body.classList.add('admin-dark');
        if (icon) icon.className = 'fas fa-sun';
      } else {
        body.classList.remove('admin-dark');
        if (icon) icon.className = 'fas fa-moon';
      }
    }
    
    const saved = localStorage.getItem(KEY) || 'light';
    if (document.body) applyTheme(saved);
    else document.addEventListener('DOMContentLoaded', () => applyTheme(saved));
    
    document.addEventListener('click', function(e) {
      const btn = e.target.closest('#themeToggleBtn');
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const isDark = document.body.classList.contains('admin-dark');
      const newTheme = isDark ? 'light' : 'dark';
      localStorage.setItem(KEY, newTheme);
      applyTheme(newTheme);
    }, true);
    
    window.addEventListener('load', () => applyTheme(localStorage.getItem(KEY) || 'light'));
  })();
</script>

function isSale(d){ if (!storeFeatures.discounts || !d) return false; const on = d.isActive === true || d.isActive === 'true' || d.isActive === 1; if (!on) return false; if (d.unlimited === true || d.unlimited === 'true' || d.unlimited === 1) return true; if (!d.endDate) return false; return new Date(d.endDate).getTime() > Date.now(); }
function salePriceVal(d){ if (!d) return null; const p = Number(d.newPrice); return (isNaN(p) || p <= 0) ? null : p; }
function effectivePrice(p){ const d = allDiscounts[p.id]; if (isSale(d)) { const sp = salePriceVal(d); if (sp !== null) return sp; } return Number(p.price) || 0; }
function getQpb(p){ if (!storeFeatures.quantityPerBox) return 1; if (!p.quantityPerBox || p.quantityPerBox <= 0) return 1; return Number(p.quantityPerBox); }

function normalizeWa(raw){ if (!raw) return ""; let n = String(raw).replace(/[^0-9]/g, ""); if (!n) return ""; n = n.replace(/^0+/, ''); if (n.startsWith('00213')) n = n.substring(2); if (!n.startsWith('213')) n = '213' + n; if (n.startsWith('213') && n.length > 12) n = n.substring(0, 12); return n; }
function findShippingFor(wilayaAr, deliveryType){ if (!wilayaAr || !shippingZones.length) return null; const idx = WILAYAS_AR.indexOf(wilayaAr); const key = isFR() && idx > -1 ? WILAYAS_FR[idx] : wilayaAr; for (const z of shippingZones){ const list = Array.isArray(z.wilayas) ? z.wilayas : []; if (list.includes(key) || list.includes(wilayaAr)){ return deliveryType === 'home' ? Number(z.homePrice || 0) : Number(z.deskPrice || 0); } } return null; }
function findBestBundleTier(product, qty){ const b = product?.landing?.bundle; if (!b || b.enabled !== true || !Array.isArray(b.tiers) || !b.tiers.length) return null; const applicable = b.tiers.map(t2 => ({ qty: parseInt(t2.qty) || 0, totalPrice: parseFloat(t2.totalPrice) || 0 })).filter(t2 => t2.qty > 0 && t2.totalPrice > 0 && qty >= t2.qty).sort((a, b2) => (a.totalPrice / a.qty) - (b2.totalPrice / b2.qty)); return applicable.length ? applicable[0] : null; }
function getUnitPriceWithBundle(product, qty){ const tier = findBestBundleTier(product, qty); if (tier) return Math.floor(tier.totalPrice / tier.qty); return effectivePrice(product); }
function calculateLineTotal(item){ const p = allProducts.find(x => x.id === item.id); if (!p) return item.price * item.quantity; const tier = findBestBundleTier(p, item.quantity); if (tier) return tier.totalPrice; return item.price * item.quantity; }
function isBundleFreeShippingActive(item){ const p = allProducts.find(x => x.id === item.id); if (!p) return false; const b = p.landing?.bundle; if (!b || b.enabled !== true) return false; const fs = b.freeShipping; if (!fs || fs.enabled !== true) return false; return item.quantity >= (parseInt(fs.minQty) || 0); }

function updateHeroInfo(idx){

function nextHero(){ if (!heroSlides.length) return; heroIndex = (heroIndex + 1) % heroSlides.length; updateHeroInfo(heroIndex); }
function prevHero(){ if (!heroSlides.length) return; heroIndex = (heroIndex - 1 + heroSlides.length) % heroSlides.length; updateHeroInfo(heroIndex); }

function heroTouchStart(e){ const t2 = e.touches[0]; heroTouch.startX = t2.clientX; heroTouch.startY = t2.clientY; heroTouch.active = true; heroPausedByTouch = true; }
function heroTouchMove(e){ if (!heroTouch.active) return; const t2 = e.touches[0]; const dx = t2.clientX - heroTouch.startX; const dy = t2.clientY - heroTouch.startY; if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) { if (e.cancelable) e.preventDefault(); } }
function heroTouchEnd(e){
  if (!heroTouch.active) return;
  heroTouch.active = false;
  const t2 = e.changedTouches[0];
  const dx = t2.clientX - heroTouch.startX;
  const dy = t2.clientY - heroTouch.startY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    const isRTL = document.body.dir === 'rtl';
    if (dx < 0){ if (isRTL) prevHero(); else nextHero(); }

function bindHero(){

function getFiltered(){

  }
  if (activeFilter === "__new__") list = list.filter(isNew);
  else if (activeFilter === "__discounts__") list = list.filter(p => isSale(allDiscounts[p.id]));
  else if (activeFilter === "__favorites__") list = list.filter(p => favorites.includes(p.id));
  else if (activeFilter === "__family__" && activeFamily) list = list.filter(p => p.family === activeFamily);
  if (searchTerm.trim()){ const s = searchTerm.toLowerCase().trim(); list = list.filter(p => (p.name || "").toLowerCase().includes(s)); }
  const collator = new Intl.Collator(isFR() ? 'fr' : 'ar');
  if (sortMode === "price-asc") list.sort((a, b) => effectivePrice(a) - effectivePrice(b));
  else if (sortMode === "price-desc") list.sort((a, b) => effectivePrice(b) - effectivePrice(a));

function isLightColorMini(hex){
  if (!hex) return false;
  const h = String(hex).replace('#','');
  if (h.length !== 6) return false;
  const r = parseInt(h.substr(0,2),16);
  const g = parseInt(h.substr(2,4),16);
  const b = parseInt(h.substr(4,6),16);
  return ((0.299*r + 0.587*g + 0.114*b) / 255) > 0.75;
}

function buildVariantsMiniHtml(p){
  if (!storeFeatures.showVariantsShowcase) return '';

  if (!v || v.enabled !== true) return '';

  const sizes  = Array.isArray(v.sizes)  ? v.sizes.filter(s => s.name) : [];
  if (!colors.length && !sizes.length) return '';

  const lang = LANG();
  const maxColors = 5;
  const maxSizes  = 3;
  let html = '<div class="pc-variants">';

  colors.slice(0, maxColors).forEach((c, i) => {
    const nm = lang === 'fr' ? (c.nameFr || c.name || '') : (c.name || c.nameFr || '');
    const light = isLightColorMini(c.hex) ? ' light-color' : '';
    html += `<button type="button" class="pc-color-mini${light}" style="background:${escapeHtml(c.hex || '#888888')}" data-color-idx="${i}" title="${escapeHtml(nm)}"></button>`;
  });
  if (colors.length > maxColors) html += `<span class="pc-variants-more">+${colors.length - maxColors}</span>`;

  sizes.slice(0, maxSizes).forEach((s, i) => {
    html += `<button type="button" class="pc-size-mini" data-size-idx="${i}">${escapeHtml(s.name)}</button>`;
  });

  html += '</div>';
  return html;
}

function renderPager(){
  const wrap = $("pager");
  const PER = 24;
  const total = getFiltered().length;
  const pages = Math.ceil(total / PER);
  if (!showcaseSettings.pagination.enabled){ wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  if (pages <= 1){ wrap.innerHTML = ""; return; }
  const btn = (label, page, opts = {}) => { const cls = opts.active ? "on" : ""; const dis = opts.disabled ? "disabled" : ""; return `<button class="${cls}" ${dis} data-page="${page}">${label}</button>`; };
  let html = btn("‹", currentPage - 1, { disabled: currentPage === 1 });
  const range = new Set([1, pages]); for (let i = currentPage - 1; i <= currentPage + 1; i++) if (i > 1 && i < pages) range.add(i);
  const sorted = [...range].sort((a,b) => a-b); let last = 0;
  sorted.forEach(n => { if (n - last > 1) html += `<span class="sep">…</span>`; html += btn(n, n, { active: n === currentPage }); last = n; });
  html += btn("›", currentPage + 1, { disabled: currentPage === pages });
  wrap.innerHTML = html;
  wrap.querySelectorAll("button[data-page]").forEach(b => b.addEventListener("click", () => { currentPage = parseInt(b.dataset.page); renderGrid(); window.scrollTo({ top: $("catalog").offsetTop - 100, behavior: "smooth" }); }));
}

  const qpb = getQpb(p); const stock = stockAvailable(p);
  const idx = cart.findIndex(x => x.id === pid);
  const currentBoxes = idx > -1 ? (Number(cart[idx].quantityBoxes) || 0) : 0;
  const nextBoxes = currentBoxes + 1;
  const nextUnits = nextBoxes * qpb;
  if (p.trackStock === true && nextUnits > stock){ toast(`⚠️ ${t('stockLimited') || 'الكمية محدودة'}`, 'error'); return; }
  const price = getUnitPriceWithBundle(p, nextUnits);
  if (idx > -1) cart[idx] = { id: pid, name: p.name, price, quantityBoxes: nextBoxes, quantity: nextUnits, qtyPerBox: qpb };
  else cart.push({ id: pid, name: p.name, price, quantityBoxes: nextBoxes, quantity: nextUnits, qtyPerBox: qpb });
  saveCart();
  trackAddToCart(p, price * nextUnits, nextUnits);
  toast(`<i class="fas fa-check-circle"></i> ${t('toastAdded') || 'أُضيف للسلة'}`, 'success');
  if (btnEl){ const original = btnEl.innerHTML; btnEl.classList.add('added'); btnEl.innerHTML = `<i class="fas fa-check"></i><span>${t('added') || 'تمت'}</span>`; setTimeout(() => { btnEl.classList.remove('added'); btnEl.innerHTML = original; }, 1200); }
}
function updateCartQty(pid, delta){
  const p = allProducts.find(x => x.id === pid); if (!p) return;
  const qpb = getQpb(p); const stock = stockAvailable(p);
  const idx = cart.findIndex(x => x.id === pid); if (idx === -1) return;
  const currentBoxes = Number(cart[idx].quantityBoxes) || 0; const nextBoxes = currentBoxes + delta;
  if (nextBoxes <= 0){ cart.splice(idx, 1); saveCart(); toast(t('toastRemoved') || 'تم الحذف'); return; }
  const nextUnits = nextBoxes * qpb;
  if (p.trackStock === true && nextUnits > stock){ toast(`⚠️ ${t('stockLimited') || 'الكمية محدودة'}`, 'error'); return; }
  const price = getUnitPriceWithBundle(p, nextUnits);
  cart[idx] = { id: pid, name: p.name, price, quantityBoxes: nextBoxes, quantity: nextUnits, qtyPerBox: qpb };
  saveCart();
}
function removeFromCart(pid){ const idx = cart.findIndex(x => x.id === pid); if (idx === -1) return; cart.splice(idx, 1); saveCart(); toast(t('toastRemoved') || 'تم الحذف'); }
function cartTotal(){ return cart.reduce((sum, it) => sum + calculateLineTotal(it), 0); }

function renderDrawer(){
  const body = $("drawerBody"), foot = $("drawerFoot"), count = $("drawerCount");
  const totalBoxes = cart.reduce((a, b) => a + (Number(b.quantityBoxes) || 0), 0);
  count.textContent = totalBoxes;
  if (!cart.length){
    body.innerHTML = `<div class="cart-empty"><i class="fas fa-shopping-bag"></i><h4>${t('cartEmpty') || 'السلة فارغة'}</h4><p>${t('cartEmptyDesc') || 'ابدأ بإضافة منتجات'}</p><a href="#" id="emptyBrowseBtn"><i class="fas fa-arrow-left"></i> ${t('browseProducts') || 'تصفح المنتجات'}</a></div>`;
    foot.innerHTML = "";
    $("emptyBrowseBtn")?.addEventListener('click', e => { e.preventDefault(); closeDrawer(); window.scrollTo({ top: $("catalog").offsetTop - 100, behavior: "smooth" }); });
    return;
  }
  body.innerHTML = cart.map(it => {
    const p = allProducts.find(x => x.id === it.id);
    const thumb = p?.imageUrl ? `<img src="${escapeHtml(p.imageUrl)}" alt="" onerror="this.parentElement.innerHTML='<div class=&quot;no-img&quot;><i class=&quot;fas fa-image&quot;></i></div>'" />` : `<div class="no-img"><i class="fas fa-image"></i></div>`;
    const lineTotal = calculateLineTotal(it);
    return `<div class="cart-row"><div class="cart-thumb">${thumb}</div><div class="cart-body"><div class="cart-name">${escapeHtml(it.name)}</div><div class="cart-line"><span class="lbl">${t('unitPrice') || 'سعر الوحدة'}</span><span class="vl">${fmt(it.price)} ${escapeHtml(curLabel())}</span></div><div class="cart-qty"><button class="qty-btn" data-dec="${escapeHtml(it.id)}">−</button><span class="qty-val">${it.quantityBoxes}</span><button class="qty-btn" data-inc="${escapeHtml(it.id)}">+</button><button class="cart-remove" data-rm="${escapeHtml(it.id)}"><i class="fas fa-trash"></i></button></div><div class="cart-line total-line"><span class="lbl">${t('lineTotal') || 'المجموع'}</span><span class="vl">${fmt(lineTotal)} ${escapeHtml(curLabel())}</span></div></div></div>`;
  }).join('');
  body.querySelectorAll("[data-inc]").forEach(b => b.addEventListener("click", () => updateCartQty(b.dataset.inc, 1)));
  body.querySelectorAll("[data-dec]").forEach(b => b.addEventListener("click", () => updateCartQty(b.dataset.dec, -1)));
  body.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => removeFromCart(b.dataset.rm)));
  const total = cartTotal();
  foot.innerHTML = `<div class="cart-tot"><span>${t('total') || 'الإجمالي'}</span><b>${fmt(total)} ${escapeHtml(curLabel())}</b></div><button class="btn-checkout" id="checkoutBtn" type="button"><i class="fas fa-check-circle"></i><span>${t('checkout') || 'إتمام الطلب'}</span></button>`;
  $("checkoutBtn").addEventListener("click", openCheckout);
}
function openDrawer(){ renderDrawer(); $("cartDrawer").classList.add("show"); $("drawerBackdrop").classList.add("show"); document.body.style.overflow = "hidden"; }
function closeDrawer(){ $("cartDrawer").classList.remove("show"); $("drawerBackdrop").classList.remove("show"); document.body.style.overflow = ""; }

function openCheckout(){
  if (!cart.length) return;
  $("checkoutItems").innerHTML = cart.map(it => { const lineTotal = calculateLineTotal(it); return `<div class="os-row"><span class="nm">${escapeHtml(it.name)}<span class="qt"> · ${it.quantity}</span></span><span class="pr">${fmt(lineTotal)} ${escapeHtml(curLabel())}</span></div>`; }).join('');
  const wSelect = $("ckWilaya");
  wSelect.innerHTML = `<option value="">${t('selectWilaya') || '-- اختر --'}</option>` + WILAYAS_AR.map((w, i) => `<option value="${escapeHtml(w)}">${wilayaLabel(w, i)}</option>`).join('');
  closeDrawer(); $("checkoutModal").classList.add("show"); updateCheckoutSummary();
  setTimeout(() => $("ckName")?.focus(), 200);
  const total = cartTotal();
  trackInitiateCheckout(cart.map(i => ({ id: i.id, name: i.name })), total);
}
function updateCheckoutSummary(){
  const subtotal = cartTotal();
  const wilaya = $("ckWilaya").value;
  const deliveryEl = document.querySelector('input[name="ckDelivery"]:checked');
  const deliveryType = deliveryEl ? deliveryEl.value : "home";
  $("csSubtotal").textContent = fmt(subtotal) + " " + curLabel();
  if (!wilaya){
    $("csShipping").innerHTML = `<span style="color:var(--text-3);font-weight:600">${t('selectWilaya') || 'اختر الولاية'}</span>`;
    $("csTotal").innerHTML = `${fmt(subtotal)} ${curLabel()}<span class="note">+ ${t('checkoutShipping') || 'الشحن'}</span>`;
    return;
  }
  let ship = findShippingFor(wilaya, deliveryType);
  let freeShipActive = false, freeShipLabel = "";
  cart.forEach(it => { if (isBundleFreeShippingActive(it)){ freeShipActive = true; freeShipLabel = getBundleFreeShipLabel(it); } });
  if (freeShipActive && ship !== null) ship = 0;
  if (ship === null){
    $("csShipping").innerHTML = `<span style="color:var(--text-3);font-weight:600">${t('shippingUnavailable') || 'غير متاح'}</span>`;
    $("csTotal").textContent = fmt(subtotal) + " " + curLabel();
  } else if (ship === 0){
    $("csShipping").innerHTML = `<span style="color:var(--success);font-weight:900">${escapeHtml(freeShipLabel) || (t('shippingFree') || 'مجاني')}</span>`;
    $("csTotal").textContent = fmt(subtotal) + " " + curLabel();
  } else {
    $("csShipping").textContent = fmt(ship) + " " + curLabel();
    $("csTotal").textContent = fmt(subtotal + ship) + " " + curLabel();
  }
}
async function submitOrder(){
  const name = $("ckName").value.trim(); const phone = $("ckPhone").value.trim();
  const wilaya = $("ckWilaya").value; const commune = $("ckCommune").value.trim(); const address = $("ckAddress").value.trim();
  const deliveryEl = document.querySelector('input[name="ckDelivery"]:checked'); const deliveryType = deliveryEl ? deliveryEl.value : "home";
  if (!name || !phone || !wilaya || !commune || !address || !cart.length) return toast(t('fillAll') || 'املأ البيانات', 'error');
  let ship = findShippingFor(wilaya, deliveryType);
  if (ship === null) return toast(t('shippingUnavailable') || 'الشحن غير متاح', 'error');
  let freeShipActive = false;
  cart.forEach(it => { if (isBundleFreeShippingActive(it)) freeShipActive = true; });
  if (freeShipActive) ship = 0;
  const subtotal = cartTotal(); const total = subtotal + ship;
  const btn = $("ckSubmit"); btn.disabled = true; const orig = btn.innerHTML; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>...</span>';
  const cartSnapshot = cart.map(i => ({ ...i }));
  try {
    const idx = WILAYAS_AR.indexOf(wilaya);
    const wilayaFr = idx > -1 ? WILAYAS_FR[idx] : wilaya;
    const fullAddress = `${wilaya} - ${commune} - ${address}`;
    const items = cart.map(it => { const p = allProducts.find(x => x.id === it.id); return { productId: it.id, name: it.name, price: it.price, quantity: it.quantity, quantityBoxes: it.quantityBoxes, qtyPerBox: it.qtyPerBox, costPrice: (p && p.costPrice != null) ? Number(p.costPrice) : 0 }; });
    await push(ref(db, 'whatsappOrders'), {
      customerName: name, phone: phone, address: fullAddress, wilaya: wilaya, wilayaFr: wilayaFr, commune: commune,
      deliveryType: deliveryType === 'home' ? 'المنزل' : 'مكتب', deliveryTypeKey: deliveryType,
      shippingCost: ship, subtotal: subtotal, items: items, totalPrice: total, timestamp: Date.now(),
      status: "pending", source: "showcase"
    });
    if (storeFeatures.inventory){
      const updates = {};
      cart.forEach(it => { const p = allProducts.find(x => x.id === it.id); if (p && p.trackStock === true){ const curQty = Number(p.stockQuantity) || 0; updates[`products/${it.id}/stockQuantity`] = Math.max(0, curQty - it.quantity); } });
      if (Object.keys(updates).length) await update(ref(db), updates);
    }
    trackPurchase(cartSnapshot, total);
    initiateCheckoutTracked = false;
    cart = []; saveCart();
    $("checkoutModal").classList.remove("show");
    $("ckName").value = ""; $("ckPhone").value = ""; $("ckCommune").value = ""; $("ckAddress").value = ""; $("ckWilaya").value = "";
    /* ✅ عرض رسالة الشكر */
  const isFR = LANG() === 'fr';
  const thankMsg = isFR
    ? `Merci <strong>${escapeHtml(name)}</strong> 🌟<br>Votre commande a bien été reçue. Notre équipe vous contactera bientôt pour la confirmer.`
    : `شكراً لك <strong>${escapeHtml(name)}</strong> 🌟<br>تم استلام طلبك وسيتصل بك فريقنا قريباً للتأكيد.`;
  $("successMessage").innerHTML = thankMsg;
  $("successModal").classList.add("show");
} catch (err){
    console.error(err);
    toast((t('orderError') || 'خطأ: ') + (err.message || ''), 'error');
  } finally { btn.disabled = false; btn.innerHTML = orig; }
}

$("searchBtn").addEventListener("click", () => { const so = $("searchOverlay"); so.classList.toggle("show"); if (so.classList.contains("show")) setTimeout(() => $("searchInput").focus(), 100); });
$("searchInput").addEventListener("input", e => { searchTerm = e.target.value; currentPage = 1; renderGrid(); });
$("favBtn").addEventListener("click", () => { activeFilter = activeFilter === "__favorites__" ? "__all__" : "__favorites__"; activeFamily = null; currentPage = 1; renderFamilyBar(); renderGrid(); window.scrollTo({ top: $("catalog").offsetTop - 100, behavior: "smooth" }); });
$("cartBtnTop").addEventListener("click", openDrawer);
$("fabCart").addEventListener("click", openDrawer);
$("drawerClose").addEventListener("click", closeDrawer);
$("drawerBackdrop").addEventListener("click", closeDrawer);
$("langBtn").addEventListener("click", () => { const cur = LANG(); const next = cur === 'ar' ? 'fr' : 'ar'; localStorage.setItem('store_lang', next); window.location.reload(); });
$("sortBtn").addEventListener("click", e => { e.stopPropagation(); $("sortMenu").classList.toggle("show"); });
document.addEventListener("click", e => { if (!e.target.closest(".sort-wrap")) $("sortMenu").classList.remove("show"); });
$("sortMenu").querySelectorAll(".sort-opt").forEach(o => o.addEventListener("click", () => {
  sortMode = o.dataset.sort;
  $("sortMenu").querySelectorAll(".sort-opt").forEach(x => x.classList.toggle("on", x === o));
  const labels = { newest: t('sortNewest') || 'الأحدث', "price-asc": t('sortPriceAsc') || 'الأقل سعراً', "price-desc": t('sortPriceDesc') || 'الأعلى سعراً', name: t('sortName') || 'الاسم' };
  $("sortLabel").textContent = labels[sortMode];
  $("sortMenu").classList.remove("show"); currentPage = 1; renderGrid();
}));
document.querySelectorAll('.delivery-opt input').forEach(inp => { inp.addEventListener('change', () => { document.querySelectorAll('.delivery-opt').forEach(o => o.classList.remove('active')); inp.closest('.delivery-opt').classList.add('active'); updateCheckoutSummary(); }); });
$("ckWilaya").addEventListener("change", updateCheckoutSummary);
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => $(b.dataset.close).classList.remove("show")));
document.querySelectorAll(".mask").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.classList.remove("show"); }));
document.addEventListener("keydown", e => { if (e.key === "Escape"){ document.querySelectorAll(".mask.show").forEach(m => m.classList.remove("show")); if ($("cartDrawer").classList.contains("show")) closeDrawer(); closeFamPanel(); } });
$("ckSubmit").addEventListener("click", submitOrder);
$("successCloseBtn").addEventListener("click", () => $("successModal").classList.remove("show"));
$("famSearch").addEventListener("input", renderFamPanel);

document.addEventListener("click", async e => {
  const btn = e.target.closest("#shareBtn"); if (!btn) return;
  const sd = { title: document.title, text: document.title, url: location.href };
  if (navigator.share) { try { await navigator.share(sd); return; } catch (err) { if (err.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(location.href); toast(`<i class="fas fa-check"></i> ${t('linkCopied') || 'تم نسخ الرابط'}`, 'success'); } catch { prompt('URL:', location.href); }
});

document.addEventListener("click", e => {
  const link = e.target.closest(".pc-media-link, .pc-name a");
  if (!link) return;
  const card = link.closest("[data-pid]");
  if (!card) return;
  const p = allProducts.find(x => x.id === card.dataset.pid);
  if (p) trackViewContent(p);
});

let lastScrollY = 0, headerHidden = false, ticking = false;
function onScroll(){
  const y = window.scrollY;
  const header = $("mainHeader");
  const fab = $("fabCart");
  const threshold = 120;
  const delta = y - lastScrollY;
  if (delta > 8 && y > threshold){ if (!headerHidden){ header.classList.add("hidden"); headerHidden = true; } }
  else if (delta < -8){ if (headerHidden){ header.classList.remove("hidden"); headerHidden = false; } }
  if (y > 300) fab.classList.add("show");
  else fab.classList.remove("show");
  lastScrollY = y;
  ticking = false;
}
window.addEventListener("scroll", () => { if (!ticking){ requestAnimationFrame(onScroll); ticking = true; } }, { passive: true });

function boot(){
  applyStoreInfo();
  renderShowcaseText();
  renderFooterActions();
  renderFooterSocials();
  renderAnnouncement();
  updateCartBadge();
  updateFavBadge();
  renderHero();
  renderFamilyBar();
  renderGrid();
  $("loadingScreen").style.display = "none";
  $("app").style.display = "block";
  if (window.applyTranslations) window.applyTranslations();
}
setTimeout(() => { if (!booted && !showcaseDisabled){ $("loadingScreen").style.display = "none"; $("app").style.display = "block"; } }, 3500);
</script>
