<style>
/* ═══════════════════════════════════════════════════════════
   1) RESET + DESIGN TOKENS
   ═══════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --primary:#0b6e4f;
  --primary-light:#1a8a6a;
  --primary-dark:#064e3b;
  --primary-50:#ecfdf5;
  --primary-100:#d1fae5;
  --primary-200:#a7f3d0;

  --vip:#7c3aed;
  --vip-light:#f5f3ff;
  --vip-100:#ede9fe;
  --danger:#dc2626;
  --danger-tint:#fef2f2;
  --warning:#d97706;
  --warning-tint:#fffbeb;
  --gold:#d4a745;

  --bg:#f7f8fa;
  --bg-2:#f1f3f5;
  --card-bg:#ffffff;
  --card:#ffffff;
  --text:#0f172a;
  --text-2:#475569;
  --text-muted:#64748b;
  --text-3:#94a3b8;
  --border:#e5e8ec;
  --border-2:#eef1f4;
  --border-strong:#d5dae0;
  --hover:#f3f5f8;

  --radius-xs:6px;
  --radius-sm:10px;
  --radius:14px;
  --radius-md:16px;
  --radius-lg:20px;
  --radius-xl:24px;
  --radius-pill:9999px;

  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.05), 0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 2px 4px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.06);
  --shadow-lg:0 8px 24px rgba(15,23,42,.08), 0 2px 6px rgba(15,23,42,.04);
  --shadow-xl:0 24px 48px rgba(15,23,42,.12);
  --shadow-focus:0 0 0 3px rgba(11,110,79,.15);

  --ease:cubic-bezier(.22,1,.36,1);
  --dur-fast:120ms;
  --dur:200ms;
  --dur-slow:300ms;

  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  --header-h:60px;
}

html,body{min-height:100%;direction:rtl;text-align:right}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:90px;
  line-height:1.55;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background var(--dur-slow) var(--ease),
             color var(--dur-slow) var(--ease);
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}

::selection{background:var(--primary-100);color:var(--primary-dark)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:var(--radius-pill);
  border:2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}

body.wholesale-active{background:var(--vip-light)}
body.wholesale-active .current-price{color:var(--vip) !important}

#loadingScreen{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);color:var(--primary);
  font-weight:700;gap:16px;font-family:var(--font);
}
#loadingScreen .spinner{
  width:44px;height:44px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

#noticeScreen{
  position:fixed;inset:0;z-index:9998;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text-muted);
  text-align:center;padding:40px;font-family:var(--font);
}
#noticeScreen .ico{font-size:64px;margin-bottom:16px}
#noticeScreen h2{
  font-weight:800;color:var(--text-2);
  margin-bottom:8px;font-size:1.3rem;letter-spacing:-.01em;
}
#noticeScreen p{font-size:.9rem;line-height:1.6;max-width:400px}
#noticeScreen code{
  background:var(--bg-2);
  padding:2px 8px;
  border-radius:var(--radius-xs);
  font-family:monospace;
  color:var(--primary);
  font-size:.85rem;
  border:1px solid var(--border);
}

header{
  position:sticky;top:0;z-index:1100;
  background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  padding:12px 20px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border);
}
.logo{
  display:flex;align-items:center;gap:10px;
  font-size:1.05rem;
  font-weight:800;
  color:var(--text);
  cursor:pointer;user-select:none;
  min-width:0;
  letter-spacing:-.015em;
}
.logo img{
  height:2.4rem;width:auto;max-width:80px;
  object-fit:contain;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
}
.logo span{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.nav-icons{display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-icons > i{
  font-size:1.15rem;
  color:var(--text-2);
  cursor:pointer;
  padding:8px;
  border-radius:var(--radius-sm);
  transition:background var(--dur) var(--ease),
             color var(--dur) var(--ease);
}
.nav-icons > i:hover{
  color:var(--primary);
  background:var(--primary-50);
}

.lang-btn{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:7px 12px;
  font-family:var(--font);
  font-size:.75rem;
  font-weight:700;
  color:var(--text-2);
  cursor:pointer;
  display:flex;align-items:center;gap:6px;
  transition:background var(--dur) var(--ease),
             color var(--dur) var(--ease),
             border-color var(--dur) var(--ease);
}
.lang-btn:hover{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}
.lang-btn i{font-size:.85rem}

#searchContainer{
  padding:12px 20px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:none;
}
#searchContainer.active{display:block;animation:slideDown var(--dur-slow) var(--ease)}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:translateY(0)}
}
#searchInput{
  width:100%;
  padding:12px 20px;
  border-radius:var(--radius-pill);
  border:1.5px solid var(--border);
  background:var(--bg);
  font-size:.95rem;
  font-family:inherit;
  outline:none;
  transition:border-color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease),
             background var(--dur) var(--ease);
}
#searchInput:hover{border-color:var(--border-strong)}
#searchInput:focus{
  border-color:var(--primary);
  box-shadow:var(--shadow-focus);
  background:#fff;
}
#searchInput::placeholder{color:var(--text-3)}

.store-hero{
  position:relative;
  width:100%;
  height:180px;
  overflow:hidden;
  background:#f0f8f4;
  border-bottom:1px solid rgba(0,0,0,.04);
}
@media(min-width:768px){
  .store-hero{height:280px}
}
.store-hero-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  transform:scale(1.02);
  transition:transform 8s ease;
}
.store-hero:hover .store-hero-img{
  transform:scale(1.06);
}
.store-hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,0.05) 40%,
    rgba(0,0,0,0.55) 80%,
    rgba(0,0,0,0.75) 100%
  );
  z-index:1;
}
.store-hero-info{
  position:absolute;
  bottom:0;
  right:0;
  left:0;
  padding:24px 24px 20px;
  z-index:2;
  color:#fff;
  text-align:right;
}
.store-hero-name{
  font-size:1.5rem;
  font-weight:800;
  margin:0 0 4px;
  letter-spacing:-0.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  line-height:1.2;
  color:#fff;
}
.store-hero-tagline{
  font-size:.85rem;
  font-weight:500;
  margin:0;
  opacity:.95;
  text-shadow:0 1px 6px rgba(0,0,0,.6);
  color:#fff;
  line-height:1.4;
}
@media(max-width:640px){
  .store-hero{height:160px}
  .store-hero-info{padding:18px 16px 16px}
  .store-hero-name{font-size:1.15rem}
  .store-hero-tagline{font-size:.75rem}
}

/* ═══════════════════════════════════════════════════════════
   💎 صندوق الجملة
   ═══════════════════════════════════════════════════════════ */
.wholesale-box{
  background:linear-gradient(135deg,var(--vip-light),#faf5ff);
  margin:12px 16px;
  padding:16px 20px;
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  border:1px solid var(--vip-100);
  display:none;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  animation:slideDown var(--dur-slow) var(--ease);
}
.wholesale-box .info{display:flex;align-items:center;gap:14px}
.wholesale-box .info .icon{
  width:44px;height:44px;
  background:linear-gradient(135deg,var(--vip),#9b59b6);
  border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  color:#fff;
  font-size:1.15rem;
  flex-shrink:0;
  box-shadow:0 4px 12px rgba(124,58,237,.25),
             inset 0 1px 0 rgba(255,255,255,.2);
}
.wholesale-box .info .text h3{
  font-size:.9rem;font-weight:800;
  margin-bottom:2px;color:var(--text);
  letter-spacing:-.01em;
}
.wholesale-box .info .text p{font-size:.72rem;color:var(--text-2)}
.wholesale-box .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wholesale-box .actions input{
  padding:8px 16px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-pill);
  background:#fff;
  font-family:var(--font);
  outline:none;
  min-width:120px;
  font-size:.85rem;
  transition:border-color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease);
}
.wholesale-box .actions input:focus{
  border-color:var(--vip);
  box-shadow:0 0 0 3px rgba(124,58,237,.15);
}
.wholesale-box .actions button{
  padding:8px 20px;
  border:none;
  border-radius:var(--radius-pill);
  font-weight:700;
  font-size:.8rem;
  cursor:pointer;
  font-family:var(--font);
  transition:all var(--dur) var(--ease);
}
.btn-activate{
  background:linear-gradient(135deg,var(--vip),#9b59b6);
  color:#fff;
  box-shadow:0 4px 12px rgba(124,58,237,.25),
             inset 0 1px 0 rgba(255,255,255,.2);
}
.btn-activate:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(124,58,237,.3);
}
.btn-deactivate{
  background:var(--bg-2);
  color:var(--text-2);
  border:1px solid var(--border) !important;
}
.btn-deactivate:hover{background:var(--border)}

#wholesaleStatus{
  font-weight:700;
  font-size:.72rem;
  padding:5px 12px;
  border-radius:var(--radius-pill);
  background:var(--bg-2);
  color:var(--text-2);
  border:1px solid var(--border);
}
#wholesaleStatus.active{
  background:var(--primary-100);
  color:var(--primary-dark);
  border-color:var(--primary-200);
}
#wholesaleStatus.inactive{
  background:var(--danger-tint);
  color:var(--danger);
  border-color:#fecaca;
}

/* ═══════════════════════════════════════════════════════════
   شريط الفلاتر — خلفية بيضاء صلبة
   ═══════════════════════════════════════════════════════════ */
.categories-wrapper{
  background:#fff;
  padding:6px 16px 4px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:var(--header-h, 60px);
  z-index:1050;
  display:none;
}
.categories-wrapper.show{display:block}
.categories-bar{
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  gap:8px;
  padding-bottom:2px;
  scrollbar-width:none;
  align-items:center;
}
.categories-bar::-webkit-scrollbar{display:none}

.cat-btn{
  flex-shrink:0;
  padding:8px 16px;
  border-radius:var(--radius-pill);
  border:1px solid var(--border);
  background:#fff;
  font-weight:600;
  font-size:.8rem;
  color:var(--text-2);
  cursor:pointer;
  transition:all var(--dur) var(--ease);
  font-family:var(--font);
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  box-shadow:var(--shadow-xs);
}
.cat-btn:hover{
  transform:translateY(-1px);
  background:var(--hover);
  border-color:var(--border-strong);
  color:var(--text);
}
.cat-btn.active{
  background:var(--primary);
  color:#fff;
  box-shadow:0 4px 12px rgba(11,110,79,.22),
             inset 0 1px 0 rgba(255,255,255,.15);
  border-color:var(--primary);
}
.cat-btn .cat-count{
  background:rgba(15,23,42,.06);
  padding:1px 7px;
  border-radius:var(--radius-pill);
  font-size:.65rem;
  font-weight:700;
  line-height:1.6;
  color:var(--text-2);
}
.cat-btn.active .cat-count{
  background:rgba(255,255,255,.25);
  color:#fff;
}

.cat-btn.discount-btn{
  background:#fff;
  color:var(--danger);
  border-color:#fecaca;
}
.cat-btn.discount-btn:hover{
  background:var(--danger-tint);
  border-color:var(--danger);
}
.cat-btn.discount-btn.active{
  background:var(--danger);
  color:#fff;
  border-color:var(--danger);
  box-shadow:0 4px 12px rgba(220,38,38,.22),
             inset 0 1px 0 rgba(255,255,255,.15);
}
.cat-btn.discount-btn .cat-count{
  background:var(--danger-tint);
  color:var(--danger);
}
.cat-btn.discount-btn.active .cat-count{
  background:rgba(255,255,255,.25);
  color:#fff;
}

.cat-btn.new-btn{
  background:#fff;
  color:#2563eb;
  border-color:#bfdbfe;
}
.cat-btn.new-btn:hover{
  background:#eff6ff;
  border-color:#2563eb;
}
.cat-btn.new-btn.active{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
  box-shadow:0 4px 12px rgba(37,99,235,.22),
             inset 0 1px 0 rgba(255,255,255,.15);
}
.cat-btn.new-btn .cat-count{
  background:#eff6ff;
  color:#2563eb;
}
.cat-btn.new-btn.active .cat-count{
  background:rgba(255,255,255,.25);
  color:#fff;
}

.families-dropdown-wrapper{
  position:relative;
  flex-shrink:0;
}
.cat-btn.families-btn{
  background:#fff;
  color:var(--primary);
  border-color:var(--primary-200);
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.cat-btn.families-btn:hover{
  background:var(--primary-50);
  border-color:var(--primary);
}
.cat-btn.families-btn.active,
.cat-btn.families-btn.open{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
  box-shadow:0 4px 12px rgba(11,110,79,.22);
}
.cat-btn.families-btn .chev{
  font-size:.65rem;
  opacity:.85;
  transition:transform var(--dur) var(--ease);
}
.cat-btn.families-btn.open .chev{
  transform:rotate(180deg);
}

.families-dropdown{
  position:fixed;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:6px;
  min-width:220px;
  max-width:320px;
  max-height:320px;
  overflow-y:auto;
  z-index:2000;
  display:none;
  animation:fadeIn .18s var(--ease);
}
.families-dropdown.show{display:block}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(-6px)}
  to{opacity:1;transform:translateY(0)}
}
.families-dropdown::-webkit-scrollbar{width:6px}
.families-dropdown::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:999px;
}

.family-dropdown-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 12px;
  border-radius:var(--radius-sm);
  font-family:var(--font);
  font-weight:600;
  font-size:.85rem;
  color:var(--text-2);
  cursor:pointer;
  border:none;
  background:none;
  width:100%;
  text-align:right;
  transition:background var(--dur-fast) var(--ease),
             color var(--dur-fast) var(--ease);
  white-space:nowrap;
}
.family-dropdown-item:hover{
  background:var(--hover);
  color:var(--text);
}
.family-dropdown-item.active{
  background:var(--primary);
  color:#fff;
}
.family-dropdown-item .fname{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  display:flex;
  align-items:center;
  gap:8px;
}
.family-dropdown-item .fname i{
  font-size:.72rem;
  opacity:.75;
}
.family-dropdown-item .fcount{
  background:rgba(15,23,42,.06);
  padding:2px 8px;
  border-radius:var(--radius-pill);
  font-size:.68rem;
  font-weight:700;
  flex-shrink:0;
  line-height:1.6;
}
.family-dropdown-item.active .fcount{
  background:rgba(255,255,255,.25);
  color:#fff;
}
.family-empty{
  padding:20px 14px;
  text-align:center;
  color:var(--text-3);
  font-size:.8rem;
  font-weight:500;
}

.cat-clear-btn{
  flex-shrink:0;
  padding:7px 14px;
  border-radius:var(--radius-pill);
  border:1px solid #fecaca;
  background:var(--danger-tint);
  color:var(--danger);
  font-weight:700;
  font-size:.72rem;
  cursor:pointer;
  display:none;
  font-family:var(--font);
  align-items:center;
  gap:4px;
  transition:all var(--dur) var(--ease);
}
.cat-clear-btn.show{display:inline-flex}
.cat-clear-btn:hover{background:#fee2e2}

/* ═══════════════════════════════════════════════════════════
   📱 زر "اسحب لرؤية المزيد"
   ═══════════════════════════════════════════════════════════ */
.scroll-hint{
  display:none;
  position:absolute;
  inset-inline-end:0;
  top:0;
  bottom:0;
  width:52px;
  pointer-events:auto;
  cursor:pointer;
  z-index:20;
  align-items:center;
  justify-content:flex-start;
  padding-inline-start:4px;
  background:linear-gradient(
    90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.65) 40%,
    rgba(255,255,255,0.95) 100%
  );
  opacity:0;
  transition:opacity .25s var(--ease);
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  border:none;
  outline:none;
}
.scroll-hint.show{
  display:flex;
  opacity:1;
}
.scroll-hint i{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;
  font-size:12px;
  box-shadow:0 2px 8px rgba(11,110,79,.35),
             inset 0 1px 0 rgba(255,255,255,.25);
  animation:scrollHintPulse 1.6s ease-in-out infinite;
  transition:transform .18s var(--ease),
             box-shadow .18s var(--ease);
}
@keyframes scrollHintPulse{
  0%,100%{transform:translateX(0);opacity:1}
  50%{transform:translateX(-5px);opacity:.75}
}
.scroll-hint:hover i{
  animation-play-state:paused;
  transform:scale(1.12);
  box-shadow:0 4px 14px rgba(11,110,79,.45),
             inset 0 1px 0 rgba(255,255,255,.3);
}
.scroll-hint:active i{
  transform:scale(.92);
  transition-duration:.08s;
}
.scroll-hint.clicked i{
  transform:scale(.85);
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  box-shadow:0 0 0 6px rgba(11,110,79,.15),
             0 2px 8px rgba(11,110,79,.35);
  transition:all .2s var(--ease);
}
@media (min-width:900px){
  .scroll-hint{display:none !important}
}

/* ═══════════════════════════════════════════════════════════
   شبكة المنتجات
   ═══════════════════════════════════════════════════════════ */
.products-container{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:16px;
}
@media(min-width:640px){
  .products-container{grid-template-columns:repeat(3,1fr);gap:18px;padding:20px 24px}
}
@media(min-width:1024px){
  .products-container{grid-template-columns:repeat(4,1fr);gap:22px;padding:24px 32px}
}
@media(min-width:1400px){
  .products-container{grid-template-columns:repeat(5,1fr)}
}

.product-card{
  background:var(--card-bg);
  border-radius:var(--radius-lg);
  overflow:hidden;
  transition:box-shadow var(--dur) var(--ease),
             transform var(--dur) var(--ease),
             border-color var(--dur) var(--ease);
  box-shadow:var(--shadow-sm);
  border:1px solid var(--border);
  position:relative;
  display:flex;
  flex-direction:column;
}
.product-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-lg);
  border-color:var(--primary-200);
}
.product-card.on-sale{
  border-color:var(--danger);
  background:#fffaf5;
}

.product-image-wrapper{
  position:relative;
  width:100%;
  padding-top:100%;
  background:#fff;
  overflow:hidden;
}
.product-image-wrapper img{
  position:absolute !important;
  top:0 !important;
  left:0 !important;
  right:0 !important;
  bottom:0 !important;
  width:100% !important;
  height:100% !important;
  max-width:none !important;
  max-height:none !important;
  min-width:100% !important;
  min-height:100% !important;
  object-fit:cover !important;
  object-position:center !important;
  padding:0 !important;
  margin:0 !important;
  display:block !important;
  cursor:zoom-in;
  transition:transform var(--dur-slow) var(--ease);
}
.product-image-wrapper img:hover{transform:scale(1.04)}

.promo-ribbon{
  position:absolute;
  bottom:0;right:0;left:0;
  background:linear-gradient(90deg,rgba(220,38,38,.9),rgba(220,38,38,.8));
  color:#fff;
  padding:5px 0;
  text-align:center;
  font-weight:800;
  font-size:11px;
  letter-spacing:1.5px;
  z-index:8;
  pointer-events:none;
  backdrop-filter:blur(4px);
}

.sale-badge{
  position:absolute;
  top:10px;right:10px;
  background:var(--danger);
  color:#fff;
  width:34px;height:34px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  z-index:10;
  box-shadow:0 4px 12px rgba(220,38,38,.35),
             inset 0 1px 0 rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.4);
}
.sale-badge.infinity{
  background:linear-gradient(135deg,#2563eb,#1e40af);
  box-shadow:0 4px 12px rgba(37,99,235,.35),
             inset 0 1px 0 rgba(255,255,255,.2);
}

.product-info{
  padding:14px 14px 14px;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.product-info h3{
  font-size:.85rem;
  font-weight:700;
  line-height:1.4;
  height:2.4rem;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  color:var(--text);
  letter-spacing:-.005em;
}

.product-price{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:6px;
  font-size:1rem;
  font-weight:800;
  margin:3px 0;
}
.product-price .current-price{
  color:var(--primary);
  font-size:1.15rem;
  font-weight:800;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.product-price .retail-price{
  font-size:.78rem;
  color:var(--text-muted);
  text-decoration:line-through;
  font-weight:500;
  font-variant-numeric:tabular-nums;
}
.product-price .discount-price{
  color:var(--danger);
  font-size:1.2rem;
  font-weight:800;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.product-price .discount-price .badge{
  font-size:.55rem;
  background:var(--danger);
  color:#fff;
  padding:2px 8px;
  border-radius:var(--radius-pill);
  margin-right:4px;
  font-weight:700;
  vertical-align:middle;
  letter-spacing:.02em;
}
.product-price .wholesale-price{
  color:var(--vip);
  font-size:1.15rem;
  font-weight:800;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.product-price .wholesale-price .badge{
  font-size:.55rem;
  background:var(--vip);
  color:#fff;
  padding:2px 8px;
  border-radius:var(--radius-pill);
  margin-right:4px;
  font-weight:700;
  vertical-align:middle;
  letter-spacing:.02em;
}

.product-family-tag{
  font-size:.65rem;
  color:var(--text-2);
  background:var(--bg-2);
  padding:3px 10px;
  border-radius:var(--radius-pill);
  display:inline-block;
  align-self:flex-start;
  border:1px solid var(--border);
  font-weight:500;
}
.product-box-qty{
  font-size:.65rem;
  color:#1e40af;
  background:#dbeafe;
  padding:3px 10px;
  border-radius:var(--radius-pill);
  display:inline-block;
  align-self:flex-start;
  font-weight:600;
  border:1px solid #bfdbfe;
}
.discount-timer{
  font-size:.7rem;
  color:var(--danger);
  font-weight:600;
  background:var(--danger-tint);
  padding:3px 10px;
  border-radius:var(--radius-pill);
  display:inline-block;
  direction:ltr;
  align-self:flex-start;
  border:1px solid #fecaca;
  font-variant-numeric:tabular-nums;
}
.discount-timer.unlimited{
  background:#dbeafe;
  color:#2563eb;
  border-color:#bfdbfe;
}

.qty-controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--bg-2);
  padding:4px 6px 4px 4px;
  border-radius:var(--radius-pill);
  gap:2px;
  margin-top:8px;
  border:1px solid var(--border);
}
.qty-btn{
  width:32px;height:32px;
  border:none;
  border-radius:50%;
  background:#fff;
  font-weight:700;
  font-size:1rem;
  cursor:pointer;
  box-shadow:var(--shadow-xs);
  transition:all var(--dur) var(--ease);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}
.qty-btn:hover{
  background:var(--primary);
  color:#fff;
  box-shadow:0 4px 10px rgba(11,110,79,.25);
  transform:translateY(-1px);
}
.qty-btn:active{transform:translateY(0) scale(.96)}
.qty-input{
  width:48px;
  text-align:center;
  border:1px solid var(--border);
  border-radius:var(--radius-pill);
  padding:6px 0;
  background:#fff;
  font-family:var(--font);
  font-weight:700;
  font-size:.85rem;
  outline:none;
  font-variant-numeric:tabular-nums;
  transition:border-color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease);
}
.qty-input:focus{
  border-color:var(--primary);
  box-shadow:var(--shadow-focus);
}
.qty-label{
  font-size:.65rem;
  color:var(--text-muted);
  font-weight:600;
  margin-right:2px;
}

.no-data{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--text-muted);
}
.no-data i{
  font-size:3rem;
  display:block;
  margin-bottom:14px;
  color:var(--border-strong);
}

#pagination{
  text-align:center;
  margin:16px 0 24px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:4px;
}
#pagination button{
  min-width:36px;
  height:36px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  background:#fff;
  color:var(--text);
  font-weight:600;
  font-size:.85rem;
  box-shadow:var(--shadow-xs);
  cursor:pointer;
  font-family:var(--font);
  transition:all var(--dur) var(--ease);
  font-variant-numeric:tabular-nums;
}
#pagination button:hover:not(:disabled){
  background:var(--hover);
  border-color:var(--border-strong);
  transform:translateY(-1px);
}
#pagination button.active-page{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
  box-shadow:0 4px 12px rgba(11,110,79,.22),
             inset 0 1px 0 rgba(255,255,255,.15);
}
#pagination button:disabled{opacity:.35;cursor:not-allowed}

#cartBtn{
  position:fixed;
  bottom:24px;
  left:24px;
  width:58px;height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  border:none;
  color:#fff;
  font-size:1.4rem;
  box-shadow:0 8px 24px rgba(11,110,79,.35),
             0 2px 6px rgba(11,110,79,.2),
             inset 0 1px 0 rgba(255,255,255,.2);
  cursor:pointer;
  z-index:1050;
  display:none;
  align-items:center;
  justify-content:center;
  transition:transform var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease);
}
#cartBtn.show{display:flex}
#cartBtn:hover{
  transform:scale(1.06);
  box-shadow:0 12px 28px rgba(11,110,79,.4),
             inset 0 1px 0 rgba(255,255,255,.2);
}
#cartBtn:active{transform:scale(.98)}

#cartBadge{
  position:absolute;
  top:-4px;right:-4px;
  background:var(--danger);
  color:#fff;
  border-radius:var(--radius-pill);
  padding:3px 8px;
  font-size:.65rem;
  font-weight:800;
  min-width:22px;
  text-align:center;
  border:2px solid #fff;
  box-shadow:0 2px 6px rgba(220,38,38,.35);
  font-variant-numeric:tabular-nums;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.show{display:flex;animation:fadeIn var(--dur-slow) var(--ease)}

.modal-content{
  background:#fff;
  width:100%;
  max-width:480px;
  border-radius:var(--radius-xl);
  padding:24px 22px;
  box-shadow:var(--shadow-xl);
  max-height:90vh;
  overflow-y:auto;
  border:1px solid var(--border);
  animation:modalIn var(--dur-slow) var(--ease);
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.modal-content h3{
  text-align:center;
  font-weight:800;
  margin-bottom:18px;
  padding-bottom:14px;
  border-bottom:1px solid var(--border);
  font-size:1.05rem;
  color:var(--text);
  letter-spacing:-.01em;
}

.form-control{
  width:100%;
  padding:12px 18px;
  margin-bottom:12px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-pill);
  font-family:var(--font);
  background:var(--bg);
  font-size:.9rem;
  outline:none;
  transition:border-color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease),
             background var(--dur) var(--ease);
}
.form-control:hover{border-color:var(--border-strong)}
.form-control:focus{
  border-color:var(--primary);
  box-shadow:var(--shadow-focus);
  background:#fff;
}
.form-control::placeholder{color:var(--text-3)}

.address-container{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}
.address-container input{flex:1;margin-bottom:0}

.location-btn{
  background:#4285f4;
  color:#fff;
  border:none;
  border-radius:var(--radius-pill);
  padding:12px 18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:.8rem;
  font-weight:600;
  white-space:nowrap;
  font-family:var(--font);
  box-shadow:0 4px 12px rgba(66,133,244,.25),
             inset 0 1px 0 rgba(255,255,255,.2);
  transition:all var(--dur) var(--ease);
}
.location-btn:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(66,133,244,.3);
}
.location-btn:disabled{opacity:.6;cursor:not-allowed}

.btn-order{
  width:100%;
  padding:15px;
  border:none;
  border-radius:var(--radius-pill);
  background:linear-gradient(135deg,#25d366,#128c7e);
  color:#fff;
  font-weight:800;
  font-size:1rem;
  cursor:pointer;
  font-family:var(--font);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  letter-spacing:-.005em;
  box-shadow:0 8px 20px rgba(37,211,102,.28),
             inset 0 1px 0 rgba(255,255,255,.2);
  transition:all var(--dur) var(--ease);
}
.btn-order:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 12px 26px rgba(37,211,102,.35);
}
.btn-order:disabled{
  opacity:.5;
  cursor:not-allowed;
  background:#94a3b8;
  box-shadow:none;

}
.btn-order.without-wa{

  box-shadow:0 8px 20px rgba(11,110,79,.28),
             inset 0 1px 0 rgba(255,255,255,.2);
}

.clear-cart-btn{
  width:100%;
  margin-top:10px;
  background:var(--danger-tint);

  border:1px solid #fecaca;
  padding:11px;

  font-weight:700;

}
.clear-cart-btn:hover{background:#fee2e2;border-color:var(--danger)}

#cartItemsList{

}
.cart-item{
  display:flex;

  border-bottom:1px solid var(--border-2);

  gap:10px;
  color:var(--text-2);
}
.cart-item:last-child{border-bottom:none}
.cart-item span:last-child{
  font-weight:700;
  color:var(--primary);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
#cartTotal{
  font-weight:800;
  text-align:center;
  margin:12px 0 18px;
  font-size:1.15rem;
  color:var(--primary);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}

#imageModal .modal-content{
  background:transparent;
  box-shadow:none;
  max-width:90%;
  padding:0;
  display:flex;
  justify-content:center;
  align-items:center;
  border:none;
  animation:modalIn var(--dur-slow) var(--ease);
}
#modalImg{
  max-width:95%;
  max-height:80vh;
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-xl);
}

.toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#0f172a;
  color:#fff;
  padding:13px 24px;
  border-radius:var(--radius-md);
  font-size:.88rem;
  z-index:5000;
  display:none;
  font-family:var(--font);
  max-width:90%;
  text-align:center;
  box-shadow:var(--shadow-xl);
  font-weight:600;
  border:1px solid rgba(255,255,255,.08);
  letter-spacing:-.005em;
}
.toast.show{display:block;animation:toastUp var(--dur-slow) var(--ease)}
@keyframes toastUp{
  from{opacity:0;transform:translate(-50%,14px)}
  to{opacity:1;transform:translate(-50%,0)}
}

footer{
  text-align:center;
  padding:24px 16px;
  background:#fff;
  margin-top:24px;
  font-size:.75rem;
  color:var(--text-muted);
  border-top:1px solid var(--border);

footer p{margin-bottom:6px}
footer p:last-child{margin-bottom:0}
footer a{
  color:var(--primary);
  text-decoration:none;

  transition:color var(--dur) var(--ease);
}
footer a:hover{color:var(--primary-dark);text-decoration:underline}
footer i{color:var(--primary);margin-inline-end:4px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;

select{

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, onValue, get, push, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

const $ = id => document.getElementById(id);

const BOOT = window.STORE_BOOTSTRAP;
const loadingScreen = $("loadingScreen");
const noticeScreen = $("noticeScreen");

function showNotice(icon, title, message) {
  loadingScreen.style.display = "none";
  noticeScreen.style.display = "flex";
  noticeScreen.innerHTML = `<div class="ico">${icon}</div><h2>${title}</h2><p>${message}</p>`;
}

if (!BOOT) {
  showNotice("⚠️", t('noticeConfigMissingTitle'), t('noticeConfigMissingMsg'));
  throw new Error("config.js missing");
}
const fc = BOOT.firebaseConfig || {};
if (!fc.apiKey || fc.apiKey.includes("YOUR_")) {
  showNotice("🔑", t('noticeConfigIncompleteTitle'), t('noticeConfigIncompleteMsg'));
  throw new Error("firebaseConfig not set");
}

const app = initializeApp(fc);
const db = getDatabase(app);
const auth = getAuth(app);
signInAnonymously(auth).catch(err => console.warn("Auth:", err.message));

let storeInfo = {
  name: "", logoUrl: "", phoneInvoice: "", address: "",
  whatsappNumber: "", enableWhatsapp: false, enableLocation: false, currency: "", tagline: ""
};

let storeFeatures = {
  costPrice: true, inventory: true, quantityPerBox: true, wholesale: true,
  discounts: true, landing: true, reviews: true, shipping: true
};

let storeConfigured = false;

/* ═══════════════════════════════════════════════════════════
   🎯 بيكسل
   ═══════════════════════════════════════════════════════════ */
let activePixelId = null;
let activeTiktokPixelId = null;
let initiateCheckoutTracked = false;

function pixelCurrency() {
  const c = storeInfo.currency || 'DZD';
  if (c === 'دج' || c === 'دينار' || c === 'DA' || c === 'DZD') return 'DZD';
  return c;
}

function initPixel(pixelId) {
  if (!pixelId || activePixelId) return;
  activePixelId = pixelId;
  try { fbq('init', pixelId); fbq('track', 'PageView'); } catch(e) {}
}
function initTiktokPixel(pixelId) {
  if (!pixelId || activeTiktokPixelId) return;
  activeTiktokPixelId = pixelId;
  try { ttq.load(pixelId); ttq.page(); } catch(e) {}
}

function trackAddToCart(product, totalValue, qty) {
  const cur = pixelCurrency();
  if (typeof fbq !== 'undefined' && activePixelId) {
    try { fbq('track', 'AddToCart', { content_name: product.name, content_ids: [String(product.id)], content_type: 'product', value: totalValue, quantity: qty, currency: cur }); } catch(e) {}
  }
  if (typeof ttq !== 'undefined' && activeTiktokPixelId) {
    try { ttq.track('AddToCart', { content_id: String(product.id), content_type: 'product', content_name: product.name, value: totalValue, quantity: qty, currency: cur }); } catch(e) {}
  }
}

function trackInitiateCheckout(items, totalValue) {
  if (initiateCheckoutTracked) return;
  initiateCheckoutTracked = true;
  const cur = pixelCurrency();
  const ids = items.map(i => String(i.id));
  if (typeof fbq !== 'undefined' && activePixelId) {
    try { fbq('track', 'InitiateCheckout', { content_ids: ids, content_type: 'product', value: totalValue, num_items: items.length, currency: cur }); } catch(e) {}
  }
  if (typeof ttq !== 'undefined' && activeTiktokPixelId) {
    try { ttq.track('InitiateCheckout', { content_id: ids[0] || '', content_type: 'product', value: totalValue, quantity: items.length, currency: cur }); } catch(e) {}
  }
}

function trackPurchase(items, totalValue) {
  const cur = pixelCurrency();
  const ids = items.map(i => String(i.id));
  if (typeof fbq !== 'undefined' && activePixelId) {
    try { fbq('track', 'Purchase', { content_ids: ids, content_type: 'product', value: totalValue, num_items: items.length, currency: cur }); } catch(e) {}
  }
  if (typeof ttq !== 'undefined' && activeTiktokPixelId) {
    try { ttq.track('CompletePayment', { content_id: ids[0] || '', content_type: 'product', value: totalValue, quantity: items.length, currency: cur }); } catch(e) {}
  }
}
/* ═══════════════════════════════════════════════════════════ */

let wholesaleCode = null;
let allProducts = [];
let allProductsRaw = [];
let allDiscounts = {};
let familiesList = [];
let cart = [];
try { cart = JSON.parse(localStorage.getItem('cart_store')) || []; } catch(e){ cart=[]; }
let currentFamilyFilter = "__all__";
let currentPage = 1;
const PER_PAGE = 20;
let searchTerm = '';
let isWholesaleActive = localStorage.getItem('wholesale_active') === 'true';
let booted = false;

let newProductDays = 30;
let newProductsEnabled = true;

const escapeHtml = s => !s ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => Number(n || 0).toLocaleString('fr-FR');

function normalizeWhatsappNumber(raw) {
  if (!raw) return "";
  let num = String(raw).replace(/[^0-9]/g, "");
  if (!num) return "";
  num = num.replace(/^0+/, "");
  if (num.startsWith("00213")) num = num.substring(2);
  if (!num.startsWith("213")) num = "213" + num;
  if (num.startsWith("213") && num.length > 12) num = num.substring(0, 12);
  return num;
}

function curLbl() {
  const c = storeInfo.currency || 'دج';
  const lng = window.currentLang || 'ar';
  if (lng === 'fr' && (c === 'دج' || c === 'DZD' || c === 'دينار')) return 'DA';
  return c;
}

function isDiscountActive(disc) {
  if (!storeFeatures.discounts) return false;
  if (!disc || typeof disc !== 'object') return false;
  const active = (disc.isActive === true || disc.isActive === 'true' || disc.isActive === 1);
  if (!active) return false;
  const unlimited = (disc.unlimited === true || disc.unlimited === 'true' || disc.unlimited === 1);
  if (unlimited) return true;
  if (!disc.endDate) return false;
  const endT = new Date(disc.endDate).getTime();
  return !isNaN(endT) && endT > Date.now();
}
function getDiscountPrice(disc) {
  if (!disc) return null;
  const p = Number(disc.newPrice);
  return (isNaN(p) || p <= 0) ? null : p;
}

function getWholesalePrice(p) {
  if (!storeFeatures.wholesale) return null;
  if (p.wholesalePrice === undefined || p.wholesalePrice === null) return null;
  const wh = Number(p.wholesalePrice);
  return (isNaN(wh) || wh <= 0) ? null : wh;
}

function getQpb(p) {
  if (!storeFeatures.quantityPerBox) return 1;
  if (!p.quantityPerBox || p.quantityPerBox <= 0) return 1;
  return Number(p.quantityPerBox);
}

function showToast(msg) {
  const el = $("toastMessage");
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => el.classList.remove('show'), 3500);
}

function applyFeatures() {
  const df = $("filterDiscountsBtn");
  if (df) df.style.display = storeFeatures.discounts ? 'inline-flex' : 'none';
  if (!storeFeatures.discounts && currentFamilyFilter === "__discounts__") {
    currentFamilyFilter = "__all__";
    updateActiveCategory();
  }

  const nf = $("filterNewBtn");
  if (nf) nf.style.display = newProductsEnabled ? 'inline-flex' : 'none';
  if (!newProductsEnabled && currentFamilyFilter === "__new__") {
    currentFamilyFilter = "__all__";
    updateActiveCategory();
  }

  const wb = $("wholesaleBox");
  if (wb && !storeFeatures.wholesale) wb.style.display = 'none';
}

function applyStoreInfo() {
  if (!storeConfigured) {
    showNotice("🏪", t('noticeStoreNotReadyTitle'), t('noticeStoreNotReadyMsg'));
    return;
  }
  document.title = storeInfo.name;
  $("storeName").textContent = storeInfo.name;
  $("footerStoreName").textContent = storeInfo.name;
  $("footerYear").textContent = new Date().getFullYear();

  const lg = $("storeLogo");
  if (storeInfo.logoUrl) { lg.src = storeInfo.logoUrl; lg.style.display = "inline-block"; lg.onerror = () => lg.style.display = "none"; }
  else lg.style.display = "none";

  if (storeInfo.phoneInvoice) {
    $("footerPhoneLine").style.display = "block";
    const lk = $("footerPhoneLink");
    lk.href = "tel:" + storeInfo.phoneInvoice;
    lk.textContent = storeInfo.phoneInvoice;
  } else $("footerPhoneLine").style.display = "none";

  const sb = $("sendOrderBtn");
  sb.disabled = false;
  const waReady = storeInfo.enableWhatsapp && storeInfo.whatsappNumber;
  if (waReady) {
    sb.classList.remove('without-wa');
    sb.innerHTML = '<i class="fab fa-whatsapp"></i> <span>' + t('wsBtnEnabled') + '</span>';
  } else {
    sb.classList.add('without-wa');
    sb.innerHTML = '<i class="fas fa-paper-plane"></i> <span>' + t('sendOrder') + '</span>';
  }

  $("locationBtn").style.display = storeInfo.enableLocation ? "flex" : "none";
  $("cartBtn").classList.add("show");
}

onValue(ref(db, 'store/info'), (snap) => {
  const d = snap.val() || {};
  storeConfigured = !!(d && d.name && String(d.name).trim());
  storeInfo = {
    name: d.name || "", logoUrl: d.logoUrl || "", phoneInvoice: d.phoneInvoice || "",
    address: d.address || "", whatsappNumber: d.whatsappNumber || "",
    enableWhatsapp: d.enableWhatsapp === true,
    enableLocation: d.enableLocation === true,
    currency: d.currency || "",
    tagline: d.tagline || ""
  };
  applyStoreInfo();
  if (!booted && storeConfigured) { booted = true; bootApp(); }
});

onValue(ref(db, 'store/features'), (snap) => {
  const d = snap.val() || {};
  storeFeatures = {
    costPrice: d.costPrice !== false,
    inventory: d.inventory !== false,
    quantityPerBox: d.quantityPerBox !== false,
    wholesale: d.wholesale !== false,
    discounts: d.discounts !== false,
    landing: d.landing !== false,
    reviews: d.reviews !== false,
    shipping: d.shipping !== false
  };

  newProductsEnabled = d.newProducts !== false;
  newProductDays = Number(d.newProductsDays) || 30;

  if (!storeFeatures.wholesale) {
    isWholesaleActive = false;
    localStorage.setItem('wholesale_active', 'false');
  }
  applyFeatures();
  if (isWholesaleActive && wholesaleCode && storeFeatures.wholesale) applyWholesaleUI(true);
  else applyWholesaleUI(false);
  applyFiltersAndRender();
  updateFamilyCounts();
  refreshCartPrices();
  updateCartBadge();
});

onValue(ref(db, 'store/landing'), (snap) => {
  const d = snap.val() || {};
  if (d.enablePixel && d.pixelId) initPixel(d.pixelId);
  if (d.enableTiktokPixel && d.tiktokPixelId) initTiktokPixel(d.tiktokPixelId);
});

onValue(ref(db, 'store/cover'), (snap) => {
  const d = snap.val() || {};
  const enabled = d.enabled !== false;
  const hero = $("storeHero");
  const img = $("coverImage");
  if (d.url && enabled) {
    img.src = d.url;
    hero.style.display = "block";
    const nameEl = $("storeHeroName");
    const tagEl = $("storeHeroTagline");
    if (nameEl) nameEl.textContent = storeInfo.name || "";
    if (tagEl) tagEl.textContent = storeInfo.tagline || "";
  } else {
    img.src = "";
    hero.style.display = "none";
  }
});

onValue(ref(db, 'store/wholesaleCode'), (snap) => {
  const d = snap.val();
  wholesaleCode = d ? (d.code || null) : null;
});

onValue(ref(db, 'products'), (snap) => {
  const d = snap.val() || {};
  allProductsRaw = Object.entries(d).map(([id, p]) => ({ id, ...p }));
  allProducts = allProductsRaw.filter(p => !p.hidden);
  refreshCartPrices();
  updateFamilyCounts();
  applyFiltersAndRender();
  if ($("familiesDropdown").classList.contains("show")) {
    renderFamiliesDropdown();
  }
});

onValue(ref(db, 'discounts'), (snap) => {
  try {
    const d = snap.val() || {};
    const now = Date.now();
    Object.entries(d).forEach(([pid, disc]) => {
      if (!disc || typeof disc !== 'object') return;
      const active = (disc.isActive === true || disc.isActive === 'true');
      const unlimited = (disc.unlimited === true || disc.unlimited === 'true');
      if (active && !unlimited && disc.endDate) {
        const endT = new Date(disc.endDate).getTime();
        if (!isNaN(endT) && endT < now) {
          update(ref(db, 'discounts/' + pid), { isActive: false }).catch(()=>{});
        }
      }
    });
    allDiscounts = d;
    refreshCartPrices();
    applyFiltersAndRender();
    startCountdownTimers();
    if ($("familiesDropdown").classList.contains("show")) {
      renderFamiliesDropdown();
    }
  } catch (err) { console.error('[Discounts]', err); }
});

onValue(ref(db, 'families'), (snap) => {
  const d = snap.val();
  familiesList = d ? Object.values(d).map(v => typeof v === 'string' ? v : (v.name || v)) : [];
  $("categoriesWrapper").classList.add("show");
  updateFamilyCounts();
  updateActiveCategory();
  if ($("familiesDropdown").classList.contains("show")) {
    renderFamiliesDropdown();
  }
  setTimeout(updateScrollHint, 100);
});

/* ═══════════════════════════════════════════════════════════
   🎛️ إدارة الفلاتر

function updateActiveCategory() {
  const allBtn = $("filterAllBtn");
  const newBtn = $("filterNewBtn");
  const discBtn = $("filterDiscountsBtn");
  const famBtn = $("familiesBtn");

  if (allBtn) allBtn.classList.toggle('active', currentFamilyFilter === "__all__");
  if (newBtn) newBtn.classList.toggle('active', currentFamilyFilter === "__new__");
  if (discBtn) discBtn.classList.toggle('active', currentFamilyFilter === "__discounts__");

  const isFamily = familiesList.includes(currentFamilyFilter);
  if (famBtn) famBtn.classList.toggle('active', isFamily);

  const clear = $("clearFilterBtn");
  if (!clear) return;
  if (currentFamilyFilter !== "__all__") {
    clear.classList.add('show');
    let label = currentFamilyFilter;
    if (currentFamilyFilter === "__new__") label = t('new');
    else if (currentFamilyFilter === "__discounts__") label = t('discounts');
    clear.innerHTML = `<i class="fas fa-times-circle"></i> <span>✕ ${escapeHtml(label)}</span>`;
  } else {
    clear.classList.remove('show');
  }
}

function setFamily(f) {
  currentFamilyFilter = f;
  currentPage = 1;
  updateActiveCategory();
  applyFiltersAndRender();
  closeFamiliesDropdown();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$("filterAllBtn").addEventListener('click', () => setFamily("__all__"));
$("filterNewBtn").addEventListener('click', () => {
  if (!newProductsEnabled) return;
  setFamily("__new__");
});
$("filterDiscountsBtn").addEventListener('click', () => {
  if (storeFeatures.discounts) setFamily("__discounts__");
});
$("clearFilterBtn").addEventListener('click', () => setFamily("__all__"));

/* ═══ القائمة المنسدلة للعائلات ═══ */
function openFamiliesDropdown() {
  const dd = $("familiesDropdown");
  const btn = $("familiesBtn");
  renderFamiliesDropdown();
  dd.classList.add("show");
  btn.classList.add("open");
  btn.setAttribute("aria-expanded", "true");
  positionFamiliesDropdown();
}

function closeFamiliesDropdown() {
  const dd = $("familiesDropdown");
  const btn = $("familiesBtn");
  if (!dd || !btn) return;
  dd.classList.remove("show");
  btn.classList.remove("open");
  btn.setAttribute("aria-expanded", "false");
}

function toggleFamiliesDropdown() {
  if ($("familiesDropdown").classList.contains("show")) closeFamiliesDropdown();
  else openFamiliesDropdown();
}

function positionFamiliesDropdown() {
  const dd = $("familiesDropdown");
  const btn = $("familiesBtn");
  if (!dd || !btn) return;
  const rect = btn.getBoundingClientRect();
  const margin = 8;
  const viewportW = window.innerWidth;
  const ddW = Math.min(320, Math.max(220, viewportW - 32));

  let right = viewportW - rect.right;
  if (right < margin) right = margin;
  if (right + ddW > viewportW - margin) {
    right = Math.max(margin, viewportW - ddW - margin);
  }

  dd.style.width = ddW + "px";
  dd.style.top = (rect.bottom + 6) + "px";
  dd.style.right = right + "px";
  dd.style.left = "auto";
}

function renderFamiliesDropdown() {
  const dd = $("familiesDropdown");
  if (!dd) return;

  if (!familiesList.length) {
    dd.innerHTML = `<div class="family-empty">${t('noFamilies')}</div>`;
    return;
  }

  dd.innerHTML = familiesList.map(f => {
    const cnt = allProducts.filter(p => p.family === f).length;
    const isActive = currentFamilyFilter === f;
    return `<button class="family-dropdown-item ${isActive ? 'active' : ''}" data-family="${escapeHtml(f)}" type="button">
      <span class="fname"><i class="fas fa-tag"></i>${escapeHtml(f)}</span>
      <span class="fcount">${cnt}</span>
    </button>`;
  }).join('');

  dd.querySelectorAll('.family-dropdown-item').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setFamily(btn.dataset.family);
    });
  });
}

$("familiesBtn").addEventListener('click', (e) => {
  e.stopPropagation();
  toggleFamiliesDropdown();
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#familiesBtn') && !e.target.closest('#familiesDropdown')) {
    closeFamiliesDropdown();
  }
});

window.addEventListener('scroll', () => {
  if ($("familiesDropdown").classList.contains("show")) closeFamiliesDropdown();
}, { passive: true });

window.addEventListener('resize', () => {
  if ($("familiesDropdown").classList.contains("show")) positionFamiliesDropdown();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeFamiliesDropdown();
});

/* ═══════════════════════════════════════════════════════════
   🆕 المنتجات الجديدة
   ═══════════════════════════════════════════════════════════ */
function isProductNew(p) {
  if (!p || p.hidden) return false;
  const days = newProductDays || 30;
  const cutoff = Date.now() - (days * 24 * 60 * 60 * 1000);
  return !!(p.createdAt && p.createdAt >= cutoff);
}

function getNewProductCount() {
  return allProducts.filter(p => isProductNew(p)).length;
}

function updateFamilyCounts() {
  const ca = $("countAll");
  if (ca) ca.textContent = allProducts.length;

  const cn = $("countNew");
  if (cn) cn.textContent = getNewProductCount();

  const cd = $("countDiscounts");
  if (cd) {
    const dc = storeFeatures.discounts
      ? allProducts.filter(p => isDiscountActive(allDiscounts[p.id])).length
      : 0;
    cd.textContent = dc;
  }
}

/* ═══════════════════════════════════════════════════════════
   🎨 العرض
   ═══════════════════════════════════════════════════════════ */
function applyFiltersAndRender() {
  if (!storeConfigured) return;
  let filtered = allProducts.filter(p => !p.hidden);

  if (currentFamilyFilter === "__discounts__") {
    filtered = filtered.filter(p => isDiscountActive(allDiscounts[p.id]));
  } else if (currentFamilyFilter === "__new__") {
    if (!newProductsEnabled) {
      filtered = [];
    } else {
      filtered = filtered.filter(p => isProductNew(p));
    }
  } else if (currentFamilyFilter !== "__all__") {
    filtered = filtered.filter(p => p.family === currentFamilyFilter);
  }

  if (searchTerm.trim()) {
    const t2 = searchTerm.toLowerCase().trim();
    filtered = filtered.filter(p => (p.name || '').toLowerCase().includes(t2));
  }

  renderProducts(filtered);
  updateFamilyCounts();
  setTimeout(updateScrollHint, 50);
}

function getEffectivePrice(p) {
  const wh = getWholesalePrice(p);
  /* ✅ عند تفعيل الجملة → الأولوية لسعر الجملة فوق كل شيء */
  if (isWholesaleActive && wh !== null) return wh;
  
  const d = allDiscounts[p.id];
  const onSale = isDiscountActive(d);
  const salePrice = getDiscountPrice(d);
  if (onSale && salePrice !== null) return salePrice;
  
  return Number(p.price) || 0;
}

function renderProducts(filtered) {
  const c = $("productsContainer");
  c.innerHTML = '';
  const start = (currentPage - 1) * PER_PAGE;
  const page = filtered.slice(start, start + PER_PAGE);
  if (!page.length) {
    c.innerHTML = `<div class="no-data"><i class="fas fa-box-open"></i><div>${t('noProducts')}</div></div>`;
    renderPagination(0);
    return;
  }
  page.forEach(p => {
    const d = storeFeatures.discounts ? allDiscounts[p.id] : null;
    const onSale = isDiscountActive(d);
    const salePrice = getDiscountPrice(d);
    const base = Number(p.price) || 0;
    const wh = getWholesalePrice(p);

    let display, strike, badgeText, priceClass;
if (isWholesaleActive && wh !== null) {
  display = wh; strike = base;
  badgeText = t('wholesaleBadge'); priceClass = 'wholesale-price';
} else if (onSale && salePrice !== null) {
  display = salePrice; strike = base;
  badgeText = t('discountBadge'); priceClass = 'discount-price';
} else {
  display = base; strike = null; badgeText = null; priceClass = 'current-price';
}

    const inCart = cart.find(i => i.id === p.id);
    const qtyBoxes = inCart ? (inCart.quantityBoxes || 0) : 0;
    const qpb = storeFeatures.quantityPerBox && p.quantityPerBox && p.quantityPerBox > 0
      ? Number(p.quantityPerBox) : null;
    const cur = curLbl();

    let priceHtml;
    if (strike !== null) {
      priceHtml = `<span class="retail-price">${fmt(strike)} ${cur}</span>
                   <span class="${priceClass}">${fmt(display)} ${cur} <span class="badge">${badgeText}</span></span>`;
    } else {
      priceHtml = `<span class="current-price">${fmt(display)} ${cur}</span>`;
    }

    const ribbon = onSale ? `<div class="promo-ribbon">PROMO</div>` : '';
    let badge = '';
    if (onSale) badge = d.unlimited
      ? `<div class="sale-badge infinity"><i class="fas fa-infinity"></i></div>`
      : `<div class="sale-badge"><i class="fas fa-percent"></i></div>`;

    let timer = '';
    if (onSale && d.unlimited) {
      timer = `<div class="discount-timer unlimited"><i class="fas fa-infinity"></i> ${t('permanentDiscount')}</div>`;
    } else if (onSale && d.endDate) {
      timer = `<div class="discount-timer" id="timer_${p.id}" data-end="${d.endDate}"><i class="far fa-clock"></i> <span class="time-left">${t('timerLoading')}</span></div>`;
    }

    const qtyLabel = qpb ? t('boxesLabel') : t('qtyLabel');
    const boxQtyHtml = qpb ? `<span class="product-box-qty">${t('boxPrefix')}${qpb} ${t('unitWord')}</span>` : '';

    const card = document.createElement('div');
    card.className = 'product-card' + (onSale ? ' on-sale' : '');
    card.innerHTML = `
      <div class="product-image-wrapper">
        <img src="${p.imageUrl || 'https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f4e6.svg'}" alt="" loading="lazy" data-img="${p.imageUrl || ''}">
        ${ribbon}${badge}
      </div>
      <div class="product-info">
        <h3>${escapeHtml(p.name)}</h3>
        <div class="product-price">${priceHtml}</div>
        ${p.family ? `<span class="product-family-tag">🏷️ ${escapeHtml(p.family)}</span>` : ''}
        ${boxQtyHtml}${timer}
        <div class="qty-controls">
          <span class="qty-label">${qtyLabel}:</span>
          <button class="qty-btn" data-action="minus" data-id="${p.id}">−</button>
          <input type="number" class="qty-input" value="${qtyBoxes}" min="0" data-id="${p.id}">
          <button class="qty-btn" data-action="plus" data-id="${p.id}">+</button>
        </div>
      </div>`;
    c.appendChild(card);
  });

  c.querySelectorAll('.product-image-wrapper img').forEach(img => {
    img.addEventListener('click', () => {
      const url = img.dataset.img;
      if (url) { $("modalImg").src = url; $("imageModal").classList.add('show'); }
    });
    img.addEventListener('error', () => { img.removeAttribute('src'); });
  });
  c.querySelectorAll('.qty-btn').forEach(b => b.addEventListener('click', () => {
    updateQty(b.dataset.id, b.dataset.action === 'plus' ? 1 : -1);
  }));
  c.querySelectorAll('.qty-input').forEach(inp => inp.addEventListener('change', () => {
    manualQty(inp.dataset.id, inp.value);
  }));
  updateCartBadge();
  renderPagination(filtered.length);
  page.forEach(p => {
    const d = allDiscounts[p.id];
    if (isDiscountActive(d) && d.endDate) {
      const tel = document.getElementById('timer_' + p.id);
      if (tel) updateTimer(tel);
    }
  });
  setTimeout(updateScrollHint, 50);
}

function updateQty(id, change) {
  const p = allProducts.find(x => x.id === id); if (!p) return;
  const price = getEffectivePrice(p);
  const qpb = getQpb(p);
  const idx = cart.findIndex(x => x.id === id);
  let boxes = idx > -1 ? cart[idx].quantityBoxes + change : (change > 0 ? change : 0);
  if (boxes <= 0) { if (idx > -1) cart.splice(idx, 1); }
  else {
    const item = { id, name: p.name, price, quantityBoxes: boxes, quantity: boxes * qpb, qtyPerBox: qpb };
    if (idx > -1) cart[idx] = item; else cart.push(item);
    if (change > 0) trackAddToCart(p, price * boxes * qpb, boxes * qpb);
  }
  saveCart();
}
function manualQty(id, val) {
  const p = allProducts.find(x => x.id === id); if (!p) return;
  const boxes = Math.max(0, parseInt(val) || 0);
  const price = getEffectivePrice(p);
  const qpb = getQpb(p);
  const idx = cart.findIndex(x => x.id === id);
  if (boxes <= 0) { if (idx > -1) cart.splice(idx, 1); }
  else {
    const item = { id, name: p.name, price, quantityBoxes: boxes, quantity: boxes * qpb, qtyPerBox: qpb };
    if (idx > -1) cart[idx] = item; else cart.push(item);
  }
  saveCart();
}
function saveCart() {
  localStorage.setItem('cart_store', JSON.stringify(cart));
  applyFiltersAndRender();
}
function refreshCartPrices() {
  let changed = false;
  cart.forEach(item => {
    const p = allProducts.find(x => x.id === item.id);
    if (p) {
      const newPrice = getEffectivePrice(p);
      if (item.price !== newPrice) { item.price = newPrice; changed = true; }
    }
  });
  if (changed) localStorage.setItem('cart_store', JSON.stringify(cart));
}
function updateCartBadge() {
  const count = cart.reduce((a, b) => a + (b.quantity || 0), 0);
  const b = $("cartBadge");
  b.textContent = count;
  b.style.display = count > 0 ? 'inline-block' : 'none';
}

$("cartBtn").addEventListener('click', () => {
  refreshCartPrices();
  if (cart.length) {
    const total = cart.reduce((a, b) => a + b.price * b.quantity, 0);
    trackInitiateCheckout(cart, total);
  }
  const list = $("cartItemsList");
  list.innerHTML = '';
  let total = 0;
  if (!cart.length) list.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:20px;">${t('emptyCart')}</div>`;
  else {
    cart.forEach(item => {
      const st = item.price * item.quantity;
      total += st;
      const qtyText = item.qtyPerBox > 1
        ? `${item.quantityBoxes} ${t('boxWord')} (${item.quantity} ${t('unitWord')})`
        : `${item.quantity} ${t('unitWord')}`;
      list.innerHTML += `<div class="cart-item"><span>${escapeHtml(item.name)} (${qtyText})</span><span>${fmt(st)} ${curLbl()}</span></div>`;
    });
  }
  $("cartTotal").textContent = `${t('totalLabel')}${fmt(total)} ${curLbl()}`;
  $("cartModal").classList.add('show');
});
$("closeCartBtn").addEventListener('click', () => $("cartModal").classList.remove('show'));
$("clearCartBtn").addEventListener('click', () => { cart = []; saveCart(); $("cartModal").classList.remove('show'); });

function applyWholesaleUI(active) {
  const status = $("wholesaleStatus");
  const title = $("wholesaleStatusTitle");
  const desc = $("wholesaleStatusDesc");
  const deact = $("deactivateWholesaleBtn");
  if (active && storeFeatures.wholesale) {
    document.body.classList.add('wholesale-active');
    status.className = 'active'; status.textContent = t('active');
    title.textContent = t('wsTitleActive');
    desc.textContent = t('wsDescActive');
    deact.style.display = 'inline-block';
  } else {
    document.body.classList.remove('wholesale-active');
    status.className = 'inactive'; status.textContent = t('notActive');
    title.textContent = t('wsTitleInactive');
    desc.textContent = t('wsDescInactive');
    deact.style.display = 'none';
  }
}

function updateTimer(el) {
  if (!el) return;
  const span = el.querySelector('.time-left'); if (!span) return;
  const diff = new Date(el.dataset.end).getTime() - Date.now();
  if (diff <= 0) { span.textContent = t('timerEnded'); el.style.background = '#e5e7eb'; el.style.color = '#6b7280'; return; }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  span.textContent = (d > 0 ? d + t('dayWord') + ' ' : '') + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function startCountdownTimers() {
  setInterval(() => document.querySelectorAll('.discount-timer[data-end]').forEach(updateTimer), 1000);
}

$("locationBtn").addEventListener('click', () => {
  if (!navigator.geolocation) return alert(t('alertGeoNotSupported'));
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
    return alert(t('alertGeoHttps') + location.protocol);
  }
  const btn = $("locationBtn"); const orig = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  navigator.geolocation.getCurrentPosition(
    pos => {
      const url = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
      const inp = $("custAddress");
      inp.value = inp.value.trim() ? inp.value + " | " + url : url;
      btn.disabled = false; btn.innerHTML = orig;
    },
    err => {
      btn.disabled = false; btn.innerHTML = orig;
      let msg = "";
      switch(err.code) {
        case 1: msg = t('alertGeoDenied'); break;
        case 2: msg = t('alertGeoUnavailable'); break;
        case 3: msg = t('alertGeoTimeout'); break;
      }
      alert(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
});

$("sendOrderBtn").addEventListener('click', async () => {
  const name = $("custName").value.trim();
  const phone = $("custPhone").value.trim();
  const address = $("custAddress").value.trim();
  if (!name || !phone || !address || !cart.length) return alert(t('alertFillAll'));

  refreshCartPrices();
  const total = cart.reduce((a, b) => a + b.price * b.quantity, 0);
  const cartSnapshot = cart.map(i => ({ ...i }));

  try {
    await push(ref(db, 'whatsappOrders'), {
      customerName: name, phone, address,
      items: cart.map(i => {
        const p = allProducts.find(x => x.id === i.id);
        return {
          productId: i.id,
          name: i.name, price: i.price, quantity: i.quantity,
          quantityBoxes: i.quantityBoxes, qtyPerBox: i.qtyPerBox,
          costPrice: (p && p.costPrice !== undefined && p.costPrice !== null) ? Number(p.costPrice) : 0
        };
      }),
      totalPrice: total, timestamp: Date.now(), status: "pending"
    });

    if (storeFeatures.inventory) {
      try {
        const stockUpdates = {};
        cart.forEach(item => {
          const p = allProducts.find(x => x.id === item.id);
          if (p && p.trackStock === true) {
            const curQty = Number(p.stockQuantity) || 0;
            const newQty = Math.max(0, curQty - item.quantity);
            stockUpdates[`products/${item.id}/stockQuantity`] = newQty;
          }
        });
        if (Object.keys(stockUpdates).length) {
          await update(ref(db), stockUpdates);
        }
      } catch (stockErr) {
        console.warn("Stock update failed:", stockErr);
      }
    }

    const waReady = storeInfo.enableWhatsapp && storeInfo.whatsappNumber;
    if (waReady) {
      let itemsText = "";
      cart.forEach(i => {
        const detail = (i.qtyPerBox > 1) ? `${i.quantityBoxes}x${i.qtyPerBox} ${i.name}` : `${i.quantity} × ${i.name}`;
        itemsText += `${detail} × ${i.price} = ${(i.price * i.quantity)}\n`;
      });
      let mapsText = "", addressText = "";
      if (address.includes("maps.google.com")) {
        const parts = address.split('|');
        const addr = parts[0].trim();
        const map = parts.find(p => p.includes("maps.google.com")) || "";
        if (addr) addressText = `Adresse : ${addr}\n`;
        if (map) mapsText = `Google maps : ${map.trim()}\n`;
      } else addressText = `Adresse : ${address}\n`;

      const msg = `\u202ANouvelle demande.\nDe: ${name}\nN°: ${phone}\n${addressText}${mapsText}\n${itemsText}\nTotal: ${total} ${storeInfo.currency||''}\n📅 ${new Date().toLocaleString('fr-FR')}\u202C`;
      const waNumber = normalizeWhatsappNumber(storeInfo.whatsappNumber);
      window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    trackPurchase(cartSnapshot, total);
    initiateCheckoutTracked = false;

    showToast(t('orderSuccess'));
    cart = []; saveCart();
    $("custName").value = ''; $("custPhone").value = ''; $("custAddress").value = '';
    $("cartModal").classList.remove('show');

  } catch (e) { alert(t('alertOrderError') + e.message); }
});

function renderPagination(totalItems) {
  const p = $("pagination"); p.innerHTML = '';
  const total = Math.ceil(totalItems / PER_PAGE);
  if (total <= 1) return;
  const add = (txt, pg, active = false, disabled = false) => {
    const b = document.createElement('button');
    b.textContent = txt;
    if (active) b.classList.add('active-page');
    if (disabled) b.disabled = true;
    b.addEventListener('click', () => { if (!disabled) { currentPage = pg; applyFiltersAndRender(); window.scrollTo(0,0); } });
    p.appendChild(b);
  };
  add('‹', currentPage - 1, false, currentPage === 1);
  add('1', 1, currentPage === 1);
  if (currentPage > 3) p.insertAdjacentHTML('beforeend', '<span style="padding:0 6px;color:#64748b;">…</span>');
  for (let i = Math.max(2, currentPage - 3); i <= Math.min(total - 1, currentPage + 3); i++) add(i, i, i === currentPage);
  if (currentPage < total - 2) p.insertAdjacentHTML('beforeend', '<span style="padding:0 6px;color:#64748b;">…</span>');
  if (total > 1) add(total, total, currentPage === total);
  add('›', currentPage + 1, false, currentPage === total);
}

$("searchToggle").addEventListener('click', () => $("searchContainer").classList.toggle('active'));
$("searchInput").addEventListener('input', e => { searchTerm = e.target.value; currentPage = 1; applyFiltersAndRender(); });

$("langToggleBtn").addEventListener('click', () => window.toggleLang());

document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});

function bootApp() {
  loadingScreen.style.display = 'none';
  $("appContainer").style.display = 'block';
  applyFeatures();
  if (isWholesaleActive && wholesaleCode && storeFeatures.wholesale) applyWholesaleUI(true);
  else applyWholesaleUI(false);
  updateCartBadge();
}

/* ═══════════════════════════════════════════════════════════
   📱 مؤشر "اسحب لرؤية المزيد"
   ═══════════════════════════════════════════════════════════ */
function updateScrollHint() {
  const bar = $("categoriesBar");
  const hint = $("scrollHint");
  if (!bar || !hint) return;

  if (window.innerWidth >= 900) {
    hint.classList.remove("show");
    return;
  }

  const maxScroll = bar.scrollWidth - bar.clientWidth;
  const hasOverflow = maxScroll > 4;
  const scrolled = Math.abs(bar.scrollLeft);
  const atEnd = scrolled >= (maxScroll - 6);

  if (hasOverflow && !atEnd) {
    hint.classList.add("show");
  } else {
    hint.classList.remove("show");
  }
}

/* ═══════════════════════════════════════════════════════════
   🖱️ الضغط على المؤشر — يحاول الاتجاهين لضمان العمل
   ═══════════════════════════════════════════════════════════ */
function scrollBarToNext() {
  const bar = $("categoriesBar");
  const hint = $("scrollHint");
  if (!bar) return;

  const step = Math.max(160, Math.round(bar.clientWidth * 0.6));

  if (hint) {
    hint.classList.add('clicked');
    setTimeout(() => hint.classList.remove('clicked'), 220);
  }

  const startPos = bar.scrollLeft;

  /* محاولة 1: تحريك سالب (المتصفحات الحديثة في RTL) */
  try {
    bar.scrollBy({ left: -step, behavior: 'smooth' });
  } catch (e) {
    bar.scrollLeft = startPos - step;
  }

  /* بعد فترة، إذا لم يتحرك شيء → جرّب العكس */
  setTimeout(() => {
    const nowPos = bar.scrollLeft;
    if (Math.abs(nowPos - startPos) < 5) {
      try {
        bar.scrollBy({ left: step, behavior: 'smooth' });
      } catch (e) {
        bar.scrollLeft = startPos + step;
      }
    }
    updateScrollHint();
  }, 350);

  setTimeout(updateScrollHint, 700);
}

(function initScrollHint() {
  const bar = $("categoriesBar");
  const hint = $("scrollHint");
  if (!bar || !hint) return;

  hint.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    scrollBarToNext();
  });

  bar.addEventListener('scroll', () => {
    if (bar._scrollRaf) return;
    bar._scrollRaf = requestAnimationFrame(() => {
      bar._scrollRaf = null;
      updateScrollHint();
    });
  }, { passive: true });

  let resizeTimeout = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(updateScrollHint, 150);
  });

  setTimeout(updateScrollHint, 300);
  setTimeout(updateScrollHint, 800);
  setTimeout(updateScrollHint, 1500);
})();
</script>
